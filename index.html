<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="saBChkNEkFoNTBRuBAsW0Y">
<head data-page-node-id="8GMqrEAtpCG4mHzkRkRUjT">

<title>斐石科技</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* ============================================================
   斐石科技 · 储能产品官网
   设计 token 与 Ardot 设计稿 734125485886214 完全一致
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A0B0D;          /* 页面底色 */
  --bg-alt:#101215;      /* 交替区块底 */
  --card:#14161A;        /* 卡片底 */
  --panel:#0E1014;       /* 面板 / 表格底 */
  --footer:#070809;      /* 页脚底 */
  --line:#22262E;        /* 卡片描边 */
  --line-2:#272B33;      /* 筛选 / 分页描边 */
  --line-3:#2A2F38;      /* 次级按钮描边 */
  --line-4:#3A3F49;      /* 次级按钮描边（深） */
  --line-5:#1B1F26;      /* 表格分隔 */
  --divider:#1A1D24;
  --btn-2:#16181D;       /* 次级按钮实底 */
  --icon-bg:#161C28;     /* 图标底 */
  --t1:#F2F4F7;          /* 主文字 */
  --t2:#A5ACB8;          /* 次文字 */
  --t3:#6E7683;          /* 弱文字 */
  --t4:#5A616C;          /* 占位文字 */
  --t5:#4E5561;          /* 页脚极弱文字 */
  --accent:#2997FF;      /* 强调色 */
  --accent-ink:#0066CC;  /* 强调色（亮场） */
  --pill:9999px;
  --r-lg:24px; --r:20px; --r-md:14px; --r-sm:12px; --r-xs:10px;
  --pad-x:clamp(24px,6.94vw,100px);
}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--t1);
  font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei','Hiragino Sans GB',Arial,sans-serif;
  font-size:17px;line-height:1.82;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
::selection{background:#1E3B52;color:#fff}

/* ---------- 布局 ---------- */
.wrap{max-width:1240px;margin:0 auto;width:100%}
.sec{padding:120px var(--pad-x)}
.sec--alt{background:var(--bg-alt)}
.sec--panel{background:var(--panel)}
.sec--tight{padding-top:0}
.sec-head{display:flex;gap:40px;justify-content:space-between;align-items:flex-start;margin-bottom:48px}
.sec-head__left{display:flex;flex-direction:column;gap:16px}
.kicker{font-size:13px;font-weight:500;color:var(--accent);letter-spacing:.06em}
.h2{font-size:44px;line-height:1.32;font-weight:700}
.h2--40{font-size:40px}
.sec-desc{font-size:17px;line-height:1.82;color:var(--t2);max-width:760px}
.sec-link{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:500;color:var(--accent);white-space:nowrap}
.grid{display:grid;gap:24px}
.grid--2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid--3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid--4{grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.divider{height:1px;background:var(--divider);width:100%}

/* ---------- 占位图（原型阶段保留设计稿的占位灰框） ---------- */
.ph{
  display:flex;align-items:center;justify-content:center;width:100%;
  background:#161A20;border:1px dashed #2E343D;border-radius:var(--r-sm);
  color:var(--t4);font-size:13px;letter-spacing:.08em;text-align:center;
}
.ph--flat{border-radius:0}
/* 素材就位后顶掉灰框：照片类 cover 铺满，产品切割件 contain 居中 */
.ph--img{border:0;background-color:#0E1014;background-position:center;background-repeat:no-repeat;background-size:cover;color:transparent}
.ph--img.ph--cut{background-color:transparent;background-size:contain}

/* ---------- 顶部公告条 ---------- */

/* ---------- 主导航 ---------- */
.nav{position:sticky;top:0;z-index:60;background:var(--bg);border-bottom:1px solid var(--line)}
.nav__inner{display:flex;align-items:center;justify-content:space-between;height:78px;
  padding-left:var(--pad-x);padding-right:var(--pad-x)}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.brand__mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#2997FF,#0B4C86);
  display:flex;align-items:center;justify-content:center}
.brand__mark svg{width:17px;height:17px}
.brand__name{font-size:18px;font-weight:600}
.nav-links{display:flex;align-items:center;gap:4px}
.nav-item{position:relative}
.nav-link{display:block;padding:10px 14px;border-radius:var(--pill);font-size:15px;color:var(--t2);
  transition:color .16s,background .16s;white-space:nowrap}
.nav-link:hover{color:var(--t1);background:#14171C}
.nav-link.is-active{color:var(--t1);font-weight:500;background:#16191F}
.nav-right{display:flex;align-items:center;gap:14px}
.icon-btn{width:40px;height:40px;border-radius:var(--pill);display:flex;align-items:center;justify-content:center;
  color:var(--t2);border:1px solid transparent;transition:color .16s,border-color .16s,background .16s}
.icon-btn:hover{color:var(--t1);background:#14171C}
.icon-btn.is-active{color:var(--accent);border-color:var(--accent-soft-line,#1E3B52);background:#0E1F2E}
.lang{display:flex;align-items:center;gap:9px;height:36px;padding:0 14px;border-radius:var(--pill);
  background:#17171C;border:1px solid #292E38}
.lang__b{font-size:13px;font-weight:500;line-height:1;color:var(--t3);background:none;border:0;padding:0;
  cursor:pointer;font-family:inherit;transition:color .16s}
.lang__b:hover{color:var(--t2)}
.lang__b.is-on{color:var(--t1)}
.lang__sep{width:1px;height:14px;background:#4A5261}

/* ---------- 产品下拉面板 ---------- */
.dropdown{position:absolute;left:50%;transform:translateX(-50%);top:calc(100% + 12px);width:1160px;
  background:var(--bg-alt);border-top:2px solid var(--accent);border-radius:0 0 var(--r) var(--r);
  box-shadow:0 28px 60px rgba(0,0,0,.62);padding:32px;display:none;z-index:70}
.nav-item.has-dd:hover .dropdown,.nav-item.has-dd:focus-within .dropdown{display:block}
.dropdown::before{content:"";position:absolute;left:0;right:0;top:-14px;height:14px}
.dd-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.dd-series{display:flex;flex-direction:column;gap:14px;padding:20px;border-radius:var(--r);
  background:var(--card);border:1px solid var(--line);transition:border-color .16s,background .16s}
.dd-series:hover{border-color:#2F3641;background:#16191F}
.dd-series__title{display:flex;align-items:baseline;gap:10px}
.dd-series__name{font-size:18px;font-weight:600}
.dd-series__tag{font-size:13px;color:var(--t3)}
.dd-series__list{font-size:14px;line-height:2;color:var(--t2);white-space:pre-line}
.dd-bar{display:flex;justify-content:space-between;align-items:center;margin-top:24px;padding-top:20px;
  border-top:1px solid var(--divider)}
.dd-bar__note{font-size:13px;color:var(--t3)}
.dd-bar__link{font-size:14px;font-weight:500;color:var(--accent)}

/* ---------- 单列下拉菜单（探索 / 服务支持 / 关于我们 / 项目） ---------- */
.dropdown--menu{left:0;transform:none;width:auto;min-width:200px;padding:10px}
.dd-menu{display:flex;flex-direction:column;gap:2px}
.dd-menu a{display:block;padding:11px 14px;border-radius:8px;font-size:14px;color:var(--t2);
  white-space:nowrap;transition:background .16s,color .16s}
.dd-menu a:hover{background:#16191F;color:var(--t1)}
.dd-note{padding:12px 14px;font-size:14px;line-height:1.7;color:var(--t3);white-space:nowrap}
.dd-note b{display:block;font-weight:500;color:var(--t2)}

/* ---------- 按钮 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--pill);
  font-weight:500;white-space:nowrap;transition:filter .16s,background .16s,border-color .16s,transform .08s}
.btn:active{transform:translateY(1px)}
.btn--primary{background:var(--accent);color:#fff;padding:15px 30px;font-size:16px}
.btn--primary:hover{filter:brightness(1.1)}
.btn--secondary{border:1px solid var(--line-4);color:var(--t1);padding:14px 29px;font-size:16px}
.btn--secondary:hover{background:#14171C}
.btn--soft{background:var(--btn-2);border:1px solid var(--line-3);color:var(--t1);padding:14px 29px;font-size:16px}
.btn--soft:hover{background:#1C2026}
.btn--sm{padding:10px 20px;font-size:14px}
.btn--nav{padding:10px 22px;font-size:14px}
.btn-row{display:flex;gap:14px;flex-wrap:wrap}

/* ---------- 首页 Hero ---------- */
.hero{position:relative;padding:96px var(--pad-x) 112px;overflow:hidden}
.hero::before{content:"";position:absolute;width:900px;height:900px;right:-220px;top:-320px;border-radius:50%;
  background:radial-gradient(circle,rgba(41,151,255,.20) 0%,rgba(41,151,255,.06) 42%,transparent 70%);pointer-events:none}
.hero__inner{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,600px);gap:64px;align-items:center}
.hero__copy{display:flex;flex-direction:column;gap:26px;max-width:640px}
.hero__pill{display:inline-flex;align-items:center;gap:9px;align-self:flex-start;padding:8px 16px;border-radius:var(--pill);
  background:var(--btn-2);border:1px solid var(--line-3);font-size:13px;color:var(--t2)}
.dot{width:7px;height:7px;border-radius:50%;background:#3DDC84;box-shadow:0 0 0 3px rgba(61,220,132,.16)}
.hero__title{font-size:64px;line-height:1.16;font-weight:700;letter-spacing:-.01em}
.hero__sub{font-size:17px;line-height:1.82;color:var(--t2);max-width:620px}
.hero__trust{font-size:14px;color:var(--t3)}
.hero__visual .ph{height:470px;border-radius:var(--r-lg);font-size:14px}

/* ---------- 卡片 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:30px;
  display:flex;flex-direction:column;gap:14px;transition:border-color .18s,transform .18s}
.card--link:hover{border-color:#2F3641;transform:translateY(-2px)}
.card__icon{width:48px;height:48px;border-radius:var(--r-sm);background:var(--icon-bg);
  display:flex;align-items:center;justify-content:center;color:var(--accent)}
.card__icon svg{width:24px;height:24px}
.card__title{font-size:20px;font-weight:600}
.card__desc{font-size:14px;line-height:1.75;color:var(--t2)}
.card__meta{font-size:13px;font-weight:500;color:var(--accent);margin-top:auto}
.link{font-size:14px;font-weight:500;color:var(--accent);display:inline-flex;align-items:center;gap:6px}

/* 产品系列卡 */
.series-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  display:flex;flex-direction:column;transition:border-color .18s,transform .18s}
.series-card:hover{border-color:#2F3641;transform:translateY(-2px)}
.series-card__img{height:190px;border-radius:0}
.series-card__body{padding:26px 28px 28px;display:flex;flex-direction:column;gap:12px}
.series-card__name{font-size:24px;font-weight:600}
.series-card__tag{font-size:13px;letter-spacing:.06em;color:var(--t3)}
.series-card__desc{font-size:14px;line-height:1.75;color:var(--t2)}
.series-card__models{font-size:14px;line-height:1.95;color:var(--t2);white-space:pre-line}

/* 场景卡 */
.scene-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  display:flex;flex-direction:column;transition:border-color .18s,transform .18s}
.scene-card:hover{border-color:#2F3641;transform:translateY(-2px)}
.scene-card__img{height:180px;border-radius:0}
.scene-card__body{padding:22px 24px 26px;display:flex;flex-direction:column;gap:10px}
.scene-card__title{font-size:19px;font-weight:600}
.scene-card__desc{font-size:14px;line-height:1.75;color:var(--t2)}

/* 空状态卡（首页项目方案） */
.empty-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:36px 40px;
  display:flex;flex-direction:column;gap:14px}
.empty-card__title{font-size:20px;font-weight:600}

/* 认证带 */
.band{background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:26px var(--pad-x)}
.band__inner{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.band__item{padding:11px 22px;border-radius:var(--pill);background:var(--bg-alt);border:1px solid var(--line);
  font-size:14px;color:var(--t2)}

/* 最终 CTA */
.cta-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:72px 64px;
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px;position:relative;overflow:hidden}
.cta-card::before{content:"";position:absolute;width:700px;height:700px;left:50%;top:-460px;transform:translateX(-50%);
  border-radius:50%;background:radial-gradient(circle,rgba(41,151,255,.16),transparent 68%);pointer-events:none}
.cta-card>*{position:relative}
.cta-card__title{font-size:48px;font-weight:700;line-height:1.3}
.cta-card__desc{font-size:17px;color:var(--t2);max-width:720px}

/* ---------- 页脚 ---------- */
.footer{background:var(--footer);padding:80px var(--pad-x) 0}
.footer__inner{display:flex;gap:60px;justify-content:space-between;max-width:1240px;margin:0 auto}
.footer__brand{width:340px;flex:0 0 auto;display:flex;flex-direction:column;gap:18px}
.footer__brand-txt{font-size:14px;line-height:1.86;color:var(--t3)}
.footer__brand-en{font-size:13px;color:var(--t5)}
.footer__contact{font-size:13px;line-height:24px;color:var(--t3);white-space:pre-line}
.footer__cols{display:flex;gap:56px}
.footer__col{display:flex;flex-direction:column;gap:18px}
.footer__col-title{font-size:14px;font-weight:500;color:var(--t1)}
.footer__links{font-size:14px;line-height:2.1;color:var(--t2);white-space:pre-line}
.footer__links a:hover{color:var(--accent)}
.footer__line{height:1px;background:var(--divider);max-width:1240px;margin:44px auto 0}
.footer__bottom a{color:inherit;text-decoration:none}
.footer__bottom a:hover{color:var(--accent)}
.footer__bottom{max-width:1240px;margin:0 auto;display:flex;justify-content:space-between;gap:24px;
  padding:28px 0;font-size:13px;color:var(--t5)}

/* ---------- 页头 / 面包屑 ---------- */
.crumb{padding:28px var(--pad-x) 0}
.crumb__inner{max-width:1240px;margin:0 auto;font-size:13px;color:var(--t3)}
.page-head{padding:22px var(--pad-x) 0}
.page-head__inner{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.page-head__title{font-size:48px;font-weight:700;line-height:1.26}
.page-head__desc{font-size:17px;line-height:1.82;color:var(--t2);max-width:820px}

/* ---------- 搜索 ---------- */
.searchbar{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-md);padding:8px 8px 8px 20px;max-width:860px;transition:border-color .16s,box-shadow .16s}
.searchbar:focus-within{border-color:#2F5C86;box-shadow:0 0 0 3px rgba(41,151,255,.12)}
.searchbar__icon{color:var(--t3);display:flex;flex:0 0 auto}
.searchbar__input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:17px;padding:12px 0;color:var(--t1)}
.searchbar__input::placeholder{color:var(--t4)}
.stats{display:flex;align-items:baseline;gap:14px;padding:0 var(--pad-x)}
.stats__inner{max-width:1240px;margin:0 auto;display:flex;align-items:baseline;gap:14px;width:100%}
.stats__count{font-size:15px;color:var(--t1)}
.stats__time{font-size:13px;color:var(--t3)}
.chip-row{display:flex;gap:10px;flex-wrap:wrap;padding:0 var(--pad-x)}
.chip-row__inner{max-width:1240px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap}
.chip{padding:9px 18px;border-radius:var(--pill);background:var(--btn-2);border:1px solid var(--line-2);
  font-size:14px;color:var(--t2);transition:background .16s,color .16s,border-color .16s}
.chip:hover{color:var(--t1);border-color:#333A45}
.chip.is-active{background:var(--t1);border-color:var(--t1);color:#0A0B0D;font-weight:500}
.results{display:flex;flex-direction:column;gap:12px}
.result{display:flex;gap:18px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-md);padding:22px 26px;transition:border-color .16s,background .16s}
.result:hover{border-color:#2F3641;background:#12151A}
.result__tag{flex:0 0 auto;padding:5px 12px;border-radius:var(--r-xs);background:#0E1F2E;border:1px solid #1E3B52;
  font-size:12px;color:#6BA8FF}
.result__body{display:flex;flex-direction:column;gap:8px;min-width:0}
.result__title{font-size:17px;font-weight:500}
.result__desc{font-size:14px;line-height:1.72;color:var(--t2)}

/* 空状态 */
.empty-state{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:64px 60px;
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px}
.empty-state__icon{width:56px;height:56px;border-radius:var(--r-md);background:var(--icon-bg);color:var(--t3);
  display:flex;align-items:center;justify-content:center}
.empty-state__icon svg{width:26px;height:26px}
.empty-state__title{font-size:24px;font-weight:600}
.empty-state__desc{font-size:15px;line-height:1.8;color:var(--t2);max-width:620px}
.kw-chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:620px}
.rec-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:100%;margin-top:8px;text-align:left}
.rec-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:22px;
  display:flex;flex-direction:column;gap:9px;transition:border-color .16s}
.rec-card:hover{border-color:#2F3641}
.rec-card__name{font-size:15px;font-weight:500}
.rec-card__desc{font-size:13px;line-height:1.7;color:var(--t2)}

/* ---------- 参数表 ---------- */
.spec-table{display:flex;flex-direction:column;gap:1px;background:var(--line-5);
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.spec-row{display:grid;background:var(--panel)}
.spec-row--head{background:#12161C}
.spec-cell{padding:16px 20px;font-size:14px;color:var(--t1)}
.spec-cell--key{color:var(--t3)}
.spec-row--head .spec-cell{font-size:14px;font-weight:500;color:var(--t1)}
.spec-note{font-size:13px;line-height:1.8;color:var(--t3);margin-top:16px}
.spec-5{grid-template-columns:240px repeat(5,minmax(0,1fr))}
.spec-2{grid-template-columns:240px minmax(0,1fr)}

/* ---------- 表单 ---------- */
.form-layout{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:24px;align-items:start}
.form-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:40px;
  display:flex;flex-direction:column;gap:24px}
.form-card__title{font-size:24px;font-weight:600}
.form-card__desc{font-size:14px;line-height:1.75;color:var(--t2)}
.field{display:flex;flex-direction:column;gap:9px}
.field__label{font-size:14px;color:var(--t2)}
.field__input,.field__ta{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:14px 16px;font-size:15px;outline:none;transition:border-color .16s,box-shadow .16s;width:100%}
.field__ta{min-height:120px;resize:vertical;line-height:1.7}
.field__input::placeholder,.field__ta::placeholder{color:var(--t4)}
.field__input:focus,.field__ta:focus{border-color:#2F5C86;box-shadow:0 0 0 3px rgba(41,151,255,.12)}
.field__input.is-error,.field__ta.is-error{border-color:#B4453F;box-shadow:0 0 0 3px rgba(180,69,63,.12)}
.opt-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{padding:12px 16px;border-radius:var(--r-sm);background:var(--panel);border:1px solid var(--line);
  font-size:14px;color:var(--t2);text-align:left;transition:border-color .16s,background .16s,color .16s}
.opt:hover{border-color:#333A45}
.opt.is-active{background:#0E1F2E;border-color:#1E3B52;color:#6BA8FF;font-weight:500}
.form-note{font-size:12px;line-height:1.7;color:var(--t4)}
.form-ok{background:#0E1F2E;border:1px solid #1E3B52;border-radius:var(--r-md);padding:24px;
  display:flex;flex-direction:column;gap:8px}
.form-ok__t{font-size:17px;font-weight:600;color:#6BA8FF}
.form-ok__d{font-size:14px;line-height:1.75;color:var(--t2)}
.form-note a{color:var(--accent);text-decoration:none}
.form-note a:hover{text-decoration:underline}
.hp-field{position:absolute;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
.form-err{display:none;flex-direction:column;gap:10px;background:#231517;border:1px solid #5A2F2C;
  border-radius:var(--r-md);padding:22px 24px}
.form-err.is-on{display:flex}
.form-err__t{font-size:15px;font-weight:600;color:#E8A9A4}
.form-err__d{font-size:13px;line-height:1.85;color:var(--t2)}
.form-err__row{display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}

/* ---------- 法务页（隐私政策 / 使用条款） ---------- */
.legal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 40px}
.legal__item{padding:28px 0;border-bottom:1px solid var(--line)}
.legal__item:last-child{border-bottom:0}
.legal__t{display:flex;gap:14px;align-items:baseline;font-size:16px;font-weight:600;color:var(--t1)}
.legal__n{font-size:12px;font-weight:500;color:var(--accent);letter-spacing:.06em;
  font-variant-numeric:tabular-nums;min-width:20px}
.legal__d{margin-top:12px;padding-left:34px;font-size:14px;line-height:1.9;color:var(--t2)}
.legal__d p+p{margin-top:9px}
.legal__d ul{list-style:none;display:flex;flex-direction:column;gap:9px;margin-top:2px}
.legal__d li{position:relative;padding-left:16px}
.legal__d li::before{content:"·";position:absolute;left:0;color:var(--accent);font-weight:600}

/* ---------- 网站地图 ---------- */
.sm-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.sm-card{padding:26px}
.sm-links{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.sm-links a{font-size:14px;line-height:1.6;color:var(--t2)}
.sm-links a:hover{color:var(--accent)}
.sm-links .sm-muted{font-size:14px;color:var(--t4)}
.side-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px;
  display:flex;flex-direction:column;gap:14px}
.side-card__title{font-size:16px;font-weight:600}
.side-card__txt{font-size:13px;line-height:24px;color:var(--t2);white-space:pre-line}

/* ---------- 产品详情 ---------- */
.pd{display:grid;grid-template-columns:minmax(0,620px) minmax(0,1fr);gap:56px;align-items:start}
.pd__main.ph,.pd__main .ph{height:560px;border-radius:var(--r-lg);font-size:14px}
.pd__info{display:flex;flex-direction:column;gap:18px}
.pd__tags{display:flex;gap:10px;flex-wrap:wrap}
.tag-in{padding:6px 14px;border-radius:var(--pill);background:#0E1F2E;border:1px solid #1E3B52;
  font-size:12px;color:#6BA8FF}
.tag-off{padding:6px 14px;border-radius:var(--pill);background:var(--btn-2);border:1px solid var(--line-3);
  font-size:12px;color:var(--t2)}
.pd__name{font-size:46px;font-weight:700;line-height:1.2}
.pd__pos{font-size:17px;color:var(--t2)}
.pd__desc{font-size:15px;line-height:1.8;color:var(--t2)}
.kv-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line-5);
  border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.kv{background:var(--panel);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.kv__k{font-size:12px;color:var(--t3)}
.kv__v{font-size:16px;font-weight:600}

/* ---------- 应用场景详情 ---------- */
.sc-hero{position:relative;padding:8px var(--pad-x) 0;overflow:hidden}
.sc-hero__inner{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,600px);gap:56px;align-items:center}
.sc-hero__copy{display:flex;flex-direction:column;gap:22px;max-width:640px}
.sc-hero__tag{display:inline-flex;align-items:center;gap:9px;align-self:flex-start;padding:8px 16px;
  border-radius:var(--pill);background:#0E1F2E;border:1px solid #1E3B52;font-size:13px;color:#6BA8FF}
.sc-hero__title{font-size:44px;font-weight:700;line-height:1.32}
.sc-hero__desc{font-size:17px;line-height:1.82;color:var(--t2)}
.stat-band{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line-5);
  border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;max-width:560px}
.stat{background:var(--panel);padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.stat__v{font-size:22px;font-weight:700}
.stat__k{font-size:13px;color:var(--t3)}
.sc-hero__visual .ph{height:470px;border-radius:var(--r-lg);font-size:14px}
.rt-list{display:flex;flex-direction:column;gap:1px;background:var(--line-5);border:1px solid var(--line);
  border-radius:var(--r-md);overflow:hidden}
.rt-row{display:flex;justify-content:space-between;align-items:center;gap:20px;background:var(--panel);padding:16px 24px}
.rt-row__dev{font-size:15px;color:var(--t1)}
.rt-row__val{font-size:15px;font-weight:600;color:var(--accent)}

/* FAQ 手风琴 */
.faq{display:flex;flex-direction:column;gap:12px}
.faq__item{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;
  transition:border-color .16s}
.faq__item:hover{border-color:#2F3641}
.faq__q{width:100%;display:flex;justify-content:space-between;align-items:center;gap:20px;
  padding:22px 26px;text-align:left;font-size:17px;font-weight:500}
.faq__chev{flex:0 0 auto;color:var(--t3);transition:transform .2s}
.faq__a{display:none;padding:0 26px 24px;font-size:15px;line-height:1.8;color:var(--t2);max-width:900px}
.faq__item.is-open{border-color:#2F3641;background:#16191F}
.faq__item.is-open .faq__a{display:block}
.faq__item.is-open .faq__chev{transform:rotate(180deg);color:var(--accent)}

/* ---------- 关于我们 ---------- */
.story{display:block}
.story__text{display:flex;flex-direction:column;gap:18px;max-width:760px}
.story__p{font-size:15px;line-height:1.86;color:var(--t2)}
.story__img .ph{height:360px;border-radius:var(--r-lg)}
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line-5);
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.num{background:var(--panel);padding:28px 26px;display:flex;flex-direction:column;gap:8px}
.num__v{font-size:32px;font-weight:700}
.num__d{font-size:14px;color:var(--t3)}
.milestones{display:flex;flex-direction:column;gap:1px;background:var(--line-5);border:1px solid var(--line);
  border-radius:var(--r-md);overflow:hidden}
.ms{display:grid;grid-template-columns:180px minmax(0,1fr);gap:24px;background:var(--panel);padding:24px 26px}
.ms__t{font-size:14px;color:var(--accent);font-weight:500}
.ms__c{display:flex;flex-direction:column;gap:7px}
.ms__title{font-size:16px;font-weight:500}
.ms__desc{font-size:14px;line-height:1.75;color:var(--t2)}

/* ---------- 分页器 ---------- */
.pager{display:flex;gap:10px;justify-content:center;align-items:center}
.pager__btn{padding:10px 18px;border-radius:var(--r-xs);border:1px solid var(--line-2);color:var(--t2);font-size:14px;
  transition:background .16s,color .16s,border-color .16s}
.pager__btn:hover{color:var(--t1);border-color:#333A45}
.pager__btn.is-active{background:var(--t1);border-color:var(--t1);color:#0A0B0D;font-weight:500}
.pager__btn.is-disabled{opacity:.4;cursor:not-allowed}

/* ---------- 404 ---------- */
.err{display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px;padding:72px var(--pad-x) 84px}
.err__code{font-size:120px;font-weight:800;line-height:1;letter-spacing:-.03em;
  background:linear-gradient(180deg,#2997FF,#0B4C86);-webkit-background-clip:text;background-clip:text;color:transparent}
.err__title{font-size:36px;font-weight:700}
.err__desc{font-size:16px;line-height:1.8;color:var(--t2);max-width:640px}

/* ---------- 新闻卡 ---------- */
.news-lead{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  display:grid;grid-template-columns:minmax(0,620px) minmax(0,1fr);transition:border-color .18s}
.news-lead:hover{border-color:#2F3641}
.news-lead__body{padding:40px 44px;display:flex;flex-direction:column;gap:16px;justify-content:center}
.news-lead__title{font-size:30px;font-weight:700;line-height:1.38}
.news-lead__desc{font-size:15px;line-height:1.8;color:var(--t2)}
.news-lead__meta{font-size:13px;color:var(--t3)}
.news-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  display:flex;flex-direction:column;transition:border-color .18s,transform .18s}
.news-card:hover{border-color:#2F3641;transform:translateY(-2px)}
.news-card__img{height:170px;border-radius:0}
.news-card__body{padding:20px 22px 24px;display:flex;flex-direction:column;gap:10px}
.news-card__meta{font-size:12px;color:var(--t3)}
.news-card__title{font-size:16px;font-weight:500;line-height:1.55}

/* ---------- 商品卡 ---------- */
.prod-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  display:flex;flex-direction:column;transition:border-color .18s,transform .18s}
.prod-card:hover{border-color:#2F3641;transform:translateY(-2px)}
.prod-card__img{height:200px;border-radius:0}
.prod-card__body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:9px;flex:1}
.prod-card__name{font-size:20px;font-weight:600}
.prod-card__spec{font-size:13px;color:var(--t3)}
.prod-card__actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;padding-top:12px}
.buy-bar{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:32px 40px;
  display:flex;align-items:center;justify-content:space-between;gap:32px}
.buy-bar__t{font-size:20px;font-weight:600;margin-bottom:8px}
.buy-bar__d{font-size:14px;line-height:1.75;color:var(--t2);max-width:620px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.toolbar__tools{display:flex;align-items:center;gap:20px;font-size:13px;color:var(--t3)}
.link-btn{font-size:14px;color:var(--accent);font-weight:500}

/* ---------- 响应式（原型以桌面为基准，窄屏时降级） ---------- */
@media (max-width:1180px){
  .hero__inner,.sc-hero__inner,.pd,.story,.news-lead{grid-template-columns:minmax(0,1fr)}
  .form-layout{grid-template-columns:minmax(0,1fr)}
  .hero__visual .ph,.sc-hero__visual .ph{height:340px}
  .dropdown{width:calc(100vw - 48px)}
  .dd-grid{grid-template-columns:minmax(0,1fr)}
  .footer__inner{flex-direction:column;gap:40px}
  .footer__brand{width:auto}
}
@media (max-width:900px){
  .grid--3,.grid--4,.rec-grid,.nums,.kv-row,.opt-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sm-grid{grid-template-columns:minmax(0,1fr)}
  .legal{padding:4px 22px}
  .legal__item{padding:22px 0}
  .legal__d{padding-left:0}
  .spec-5{grid-template-columns:200px repeat(5,minmax(120px,1fr))}
  .spec-table{overflow-x:auto}
  .hero__title{font-size:44px}
  .h2{font-size:34px}
  .sec{padding-top:80px;padding-bottom:80px}
  .nav-links{display:none}
  .band__inner{gap:10px}
}
/* ============================================================
   与设计稿逐项对齐的修正（数值取自 Ardot 画板实际属性）
   ============================================================ */
.series-card{padding:20px;gap:14px}              /* 系列卡内边距 20，图内缩 */
.series-card__img{border-radius:var(--r-sm)}
.series-card__body{padding:2px 4px 6px}
.scene-card__img{height:300px}
.band{padding:0 var(--pad-x) 72px;border:0}      /* 认证带无底色、无描边 */
.band__item{border:0;padding:12px 24px;border-radius:var(--r-md);background:var(--card)}
.cta-card{background:linear-gradient(180deg,#122447 0%,#0D0F14 100%);padding:88px 80px}
.hero{padding:88px var(--pad-x) 104px}

/* ---------- 企业 logo（真实素材，白色版适配暗色底） ---------- */
.brand__logo{height:34px;width:auto;display:block}
.footer__logo{height:30px;width:auto;display:block}

/* ---------- 关于我们 · 团队 / 路线图 扩展 ---------- */
.grid--5{display:grid;gap:20px;grid-template-columns:repeat(5,minmax(0,1fr))}
.member{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;
  display:flex;flex-direction:column;gap:8px}
.member__n{font-size:18px;font-weight:600}
.member__r{font-size:13px;font-weight:500;color:var(--accent)}
.note{font-size:13px;line-height:1.8;color:var(--t3);margin-top:18px}
.card__tag{font-size:13px;font-weight:500;color:var(--accent);letter-spacing:.02em}
.card__desc--task{font-size:13px;color:var(--t3)}
.card--moat{padding:28px}
@media (max-width:1024px){.grid--5{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ============================================================
   导航扩展：产品下拉改 4 列系列栅格（充电宝 / eCandle / UniCore / 配件）
   ============================================================ */
.dd-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.dd-series__title{text-decoration:none}
.dd-series__title:hover .dd-series__name{color:var(--accent)}
.dd-series__link{display:block;padding:5px 0;font-size:14px;color:var(--t2);transition:color .16s}
.dd-series__link:hover{color:var(--accent)}

/* ============================================================
   系列页 / 产品总览
   ============================================================ */
.series-facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;background:var(--card)}
.series-fact{padding:26px 28px;display:flex;flex-direction:column;gap:8px;border-right:1px solid var(--line)}
.series-fact:last-child{border-right:0}
.series-fact__k{font-size:13px;color:var(--t3)}
.series-fact__v{font-size:22px;font-weight:600;letter-spacing:-.01em}
.series-intro{display:flex;gap:64px;align-items:center}
.series-intro__copy{flex:1 1 0;display:flex;flex-direction:column;gap:18px;min-width:0}
.series-intro__visual{width:460px;flex:0 0 auto}
.series-lead{font-size:20px;line-height:1.65;color:var(--t2)}
.spec--c2{grid-template-columns:200px repeat(2,minmax(0,1fr))}
.spec--c3{grid-template-columns:200px repeat(3,minmax(0,1fr))}
.spec--c4{grid-template-columns:200px repeat(4,minmax(0,1fr))}

/* ============================================================
   招聘页
   ============================================================ */
.job-list{display:flex;flex-direction:column;gap:14px}
.job{display:flex;gap:28px;align-items:center;justify-content:space-between;padding:26px 30px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);transition:border-color .18s}
.job:hover{border-color:#2F3641}
.job__main{display:flex;flex-direction:column;gap:12px;min-width:0}
.job__title{font-size:20px;font-weight:600}
.job__meta{display:flex;gap:8px;flex-wrap:wrap}
.job__right{flex:0 0 auto}
.tag-soft{display:inline-block;font-size:12px;padding:4px 12px;border-radius:var(--pill);
  background:var(--bg-alt);border:1px solid var(--line);color:var(--t3);white-space:nowrap}
.tag-soft--on{color:var(--accent);border-color:rgba(41,151,255,.34)}
.step-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.step{display:flex;flex-direction:column;gap:10px;padding:26px 24px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r)}
.step__n{font-size:13px;font-weight:500;color:var(--accent);letter-spacing:.08em}
.step__t{font-size:17px;font-weight:600}
.step__d{font-size:14px;line-height:1.75;color:var(--t2)}

/* ============================================================
   下载中心
   ============================================================ */
.dl-group{margin-bottom:40px}
.dl-group:last-child{margin-bottom:0}
.dl-head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:16px}
.dl-head__t{font-size:20px;font-weight:600}
.dl-head__n{font-size:13px;color:var(--t3)}
.list-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dl-row{display:flex;gap:24px;align-items:center;justify-content:space-between;padding:20px 26px;
  border-bottom:1px solid var(--line)}
.dl-row:last-child{border-bottom:0}
.dl-row__main{display:flex;gap:16px;align-items:center;min-width:0}
.dl-row__ico{width:42px;height:42px;flex:0 0 auto;border-radius:var(--r-sm);background:var(--bg-alt);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.dl-row__ico svg{width:20px;height:20px}
.dl-row__t{display:flex;flex-direction:column;gap:6px;min-width:0}
.dl-row__name{font-size:16px;font-weight:500}
.dl-row__meta{font-size:13px;color:var(--t3)}
.dl-row__act{display:flex;gap:10px;flex:0 0 auto}

/* ============================================================
   常见问题（分类容器）
   ============================================================ */
.faq-cat{margin-bottom:44px}
.faq-cat:last-child{margin-bottom:0}
.faq-cat__head{display:flex;align-items:baseline;gap:14px;margin-bottom:16px}
.faq-cat__t{font-size:20px;font-weight:600}
.faq-cat__n{font-size:13px;color:var(--t3)}

/* ============================================================
   售后政策
   ============================================================ */
.policy{display:flex;flex-direction:column;gap:12px}
.policy__row{display:flex;gap:24px;padding:20px 26px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);align-items:flex-start}
.policy__k{flex:0 0 210px;font-size:14px;font-weight:500;color:var(--t1)}
.policy__v{flex:1 1 auto;font-size:14px;line-height:1.85;color:var(--t2);min-width:0}
.bullets{display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.85;color:var(--t2)}
.bullets>div{padding-left:18px;position:relative}
.bullets>div::before{content:"·";position:absolute;left:0;color:var(--accent);font-weight:600}

@media (max-width:1024px){
  .series-facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .series-fact:nth-child(2n){border-right:0}
  .series-intro{flex-direction:column;gap:32px}
  .series-intro__visual{width:100%}
  .step-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .job{flex-direction:column;align-items:flex-start;gap:18px}
  .policy__row{flex-direction:column;gap:8px}
  .policy__k{flex:0 0 auto}
  .dl-row{flex-direction:column;align-items:flex-start;gap:16px}
  .dd-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
.news-body p{font-size:16px;line-height:1.95;color:var(--t2);margin-bottom:20px}
.news-body p:last-child{margin-bottom:0}

/* ---------- 产品大菜单：通栏定位，不再跟随导航项居中（窄屏会被裁切） ---------- */
.nav-item.has-mega{position:static}
.dropdown--mega{left:0;right:0;width:auto;transform:none;top:100%;
  padding:32px var(--pad-x);border-radius:0}
/* 悬停桥：从面板顶端向上延伸，保证鼠标从「产品」移到面板不会中断 */
.dropdown--mega::before{left:0;right:0;top:-46px;height:46px}
.dropdown--mega .dd-grid,.dropdown--mega .dd-bar{max-width:1240px;margin-left:auto;margin-right:auto}
/* ---------- 资料下载登记（下载中心 / 产品页 / 规格书页） ---------- */
.dl-gate-hint{display:flex;align-items:center;gap:8px;margin:-12px 0 28px;font-size:13px;line-height:1.7;color:var(--t3)}
.dl-gate-hint svg{width:14px;height:14px;flex:0 0 auto;color:#6BA8FF}

/* ============================================================
   自建新闻动态（管理端）：存 localStorage，与内置新闻合并显示
   ============================================================ */
var NEWS_BASE = NEWS.slice();          /* 内置 10 条，只读 */
var CUSTOM_NEWS = [];                  /* 后台新增，存本机浏览器 */
var NEWS_STORE_KEY = 'foipower-news-custom';
var NEWS_CATS = [['company', '公司动态'], ['tech', '产品与技术'], ['event', '展会与活动']];
var CAT_EN = { '公司动态': 'Company News', '产品与技术': 'Product & Technology', '展会与活动': 'Exhibitions & Events' };

function loadCustomNews(){
  var raw = '';
  try { raw = localStorage.getItem(NEWS_STORE_KEY) || ''; } catch(e){ raw = ''; }
  if(!raw){ CUSTOM_NEWS = []; return; }
  try {
    var arr = JSON.parse(raw);
    CUSTOM_NEWS = (arr && arr.length)
      ? arr.filter(function(n){ return n && n.id && n.title && n.body; })
      : [];
  } catch(e){ CUSTOM_NEWS = []; }
}
function saveCustomNews(){
  try { localStorage.setItem(NEWS_STORE_KEY, JSON.stringify(CUSTOM_NEWS)); return true; }
  catch(e){ return false; }
}
function mergeNews(){
  NEWS = CUSTOM_NEWS.concat(NEWS_BASE);
  /* 自建动态的封面图注入素材表，让 phBox / hydrateImages 自动接管 */
  for(var i = 0; i < CUSTOM_NEWS.length; i++){
    var n = CUSTOM_NEWS[i];
    if(n.img) ASSETS['news/' + n.id] = n.img;
    else delete ASSETS['news/' + n.id];
  }
}
/* 自建动态的日期与阅读时长可变，词表无法预先收录 → 按数据补译（render 前调用） */
function readEn(s){
  var m = String(s || '').match(/阅读\s*(\d+)\s*分钟/);
  return m ? (m[1] + ' min read') : s;
}
function syncCustomNewsI18n(){
  if(typeof EN === 'undefined') return;
  for(var i = 0; i < CUSTOM_NEWS.length; i++){
    var n = CUSTOM_NEWS[i], ce = CAT_EN[n.catLabel] || n.catLabel;
    EN[normTxt(n.catLabel + '\u3000·\u3000' + n.date)] = ce + ' · ' + n.date;
    EN[normTxt(n.date + '\u3000·\u3000' + n.catLabel + '\u3000·\u3000' + n.read)] =
      n.date + ' · ' + ce + ' · ' + readEn(n.read);
  }
}
function catLabelOf(cat){
  for(var i = 0; i < NEWS_CATS.length; i++){ if(NEWS_CATS[i][0] === cat) return NEWS_CATS[i][1]; }
  return NEWS_CATS[0][1];
}
/* 自建动态产生/删除后，重排「新闻详情页」路由，保证走查与 hash 路由可达 */
function rebuildNewsRoutes(){
  for(var i = PAGES.length - 1; i >= 0; i--){
    if(PAGES[i].route === 'news' && PAGES[i].param) PAGES.splice(i, 1);
  }
  var at = -1;
  for(var k = 0; k < PAGES.length; k++){ if(PAGES[k].key === 'news'){ at = k; } }
  if(at < 0) at = PAGES.length - 1;
  PAGES.splice.apply(PAGES, [at + 1, 0].concat(NEWS.map(function(n){
    return {key:'news/' + n.id, route:'news', param:n.id, tpl:'tpl-news-detail',
            label:'新闻详情页（' + n.title.slice(0, 13) + '…）', nav:'探索'};
  })));
}
loadCustomNews();

/* 占位框 / 真实图 二选一。key 形如 'product/ecandle-pro'、'series/ecandle'、'news/xxx' */

function phBox(key, label, style, cls){
  var c = cls ? ' ' + cls : '';
  if(ASSETS[key]){
    var cut = key.indexOf('product/') === 0 ? ' ph--cut' : '';
    return '<div class="ph ph--img' + cut + c + '" style="' + (style ? style + ';' : '') + 'background-image:url(' + ASSETS[key] + ')"></div>';
  }
  return '<div class="ph' + c + '"' + (style ? ' style="' + style + '"' : '') + '>' + label + '</div>';
}
/* 静态模板里的图片位用 data-img="key" 标注，渲染完统一补水 */
function hydrateImages(root){
  var els = (root || document).querySelectorAll('[data-img]'), i, el, k, d;
  for(i = 0; i < els.length; i++){
    el = els[i]; k = el.getAttribute('data-img'); d = ASSETS[k];
    if(!d) continue;
    el.classList.add('ph--img');
    if(k.indexOf('product/') === 0) el.classList.add('ph--cut');
    el.style.backgroundImage = 'url(' + d + ')';
    el.innerHTML = '';
  }
}

function escHtml(s){
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escAttr(s){ return escHtml(s).replace(/"/g, '&quot;'); }

}
function newsCardHTML(n){

}
function newsLeadHTML(){

    + '<p class="news-lead__desc">' + escHtml(n.desc) + '</p>'
    + '<div class="news-lead__meta">' + escHtml(n.date) + '　·　' + n.catLabel + '　·　' + escHtml(n.read) + '</div>'
    + '</div></a>';
  return (n.custom && adminAuthed())
    ? '<div class="news-card-wrap">' + card + newsOpsHTML(n) + '</div>'
    : card;
}
function newsCardsHTML(){

}

int laboratory with industry leader Megmeet (002851.SZ) to keep technology and product quality ahead.","eCandle Pro 提供 AC+DC 与 AC+AC 两种配置，分别对应 1 路与 2 路交流输出；eCandle 2 / 3 直流输出为 5521 与 USB-A，不含 Type-C；eCandle DC-DC 为纯直流机型，规格书标注 2026 Q4 上市。":"The eCandle Pro comes in AC+DC and AC+AC configurations, corresponding to 1 and 2 AC outputs; the DC outputs of eCandle 2 / 3 are 5521 and USB-A with no Type-C; the eCandle DC-DC is a DC-only model, listed on its spec sheet for 2026 Q4 launch.","深圳市斐石科技有限公司成立于 2021 年 12 月，是一家专注新能源、物联网、Web3 三大前沿赛道的国家级高新技术企业。我们精准聚焦亚非拉离网能源市场，以「技术重构能源供给，创新实现能源平权」为核心理念，致力于打破全球能源贫困壁垒。":"Founded in December 2021 in Shenzhen, Faith Technology is a national high-tech enterprise focused on three frontier tracks: new energy, IoT and Web3. We focus precisely on the off-grid energy market across Asia, Africa and Latin America, guided by the core idea of rebuilding energy supply with technology and achieving energy equity through innovation, and we are committed to breaking down global energy poverty.","深圳市斐石科技有限公司成立于 2021 年 12 月，是一家专注于新能源、物联网、Web3 三大前沿赛道的国家级高新技术企业。公司精准聚焦亚非拉离网能源市场，针对全球超 10 亿人口的能源贫困痛点，致力于打破全球能源贫困壁垒。":"Founded in December 2021 in Shenzhen, Faith Technology is a national high-tech enterprise dedicated to three frontier tracks: new energy, IoT and Web3. We focus precisely on the off-grid energy market across Asia, Africa and Latin America, addressing the energy poverty pain point of more than 1 billion people worldwide, and are committed to breaking down global energy poverty barriers.","北纬 6°15′33.3″，东经 7°06′34.1″——尼日利亚阿南布拉州的一台 eCandle 已稳定运行。500W 输出、1004Wh 容量、500W MPPT 光伏输入，从实验室参数变成当地真实生活场景中的电力支持。":"At 6°15′33.3″N, 7°06′34.1″E — in Anambra State, Nigeria, an eCandle has been running reliably. Its 500W output, 1004Wh capacity and 500W MPPT solar input have turned from lab specifications into real power for daily life on site.","注：参数取自 UniCore 1200 规格书（2026 Edition）。规格书参数表页首型号字段印为「UniCpre 1200」，为原册笔误，本页按正确型号名 UniCore 1200 呈现；上市时间为 2026 Q4。":"Note: figures from the UniCore 1200 spec sheet (2026 Edition). The model field at the top of the spec table is printed as “UniCpre 1200”, a typo in the original document; this page shows the correct model name, UniCore 1200. Launch is 2026 Q4.","为整机提供补电能力。40W 与 60W 折叠光伏板采用新型 BC 电池，转换效率最高 24.8%，IP67 防水；输出为 USB-C（可选 USB-C + DC35135），40W 重 1.1kg、60W 重 1.5kg。":"to top up the main unit. The 40W and 60W folding panels use new BC cells, with up to 24.8% conversion efficiency and IP67 water resistance; output is USB-C (optional USB-C + DC35135), with the 40W weighing 1.1kg and the 60W 1.5kg.","40W 与 60W 共用同一份规格书（2026 Edition）。配件需与整机光伏输入功率匹配，选型前请确认机型的最大光伏输入（eCandle DC-DC 为 100W）；光伏板输出为 USB-C，接入前需核对接口形式。":"The 40W and 60W share one spec sheet (2026 Edition). Accessories must match the main unit's solar input — before choosing, confirm the model's maximum solar input (100W for the eCandle DC-DC); the panel outputs USB-C, so check the connector type before connecting.","这台设备承担的是照明、风扇、路由器与手机充电这几项最基础的负载：500W 交流输出、1004Wh 磷酸铁锂容量，白天靠 500W MPPT 光伏输入补电。对使用者来说，参数的意义只体现在一件事上——晚上灯还亮不亮。":"This unit carries the most basic loads — lighting, a fan, a router and phone charging: 500W AC output, 1004Wh LiFePO4 capacity, topped up during the day by 500W MPPT solar input. For the user, the specifications come down to one thing: whether the lights are still on at night.","按常用负载功率乘以预计使用时长估算。1004Wh 按 85% 放电深度可用约 850Wh 电量，例如 65W 笔记本约 13 小时、100W 电视约 8 小时。把用电清单发给我们，可以给一份更准确的估算。":"Estimate by multiplying typical load power by expected runtime. 1004Wh at 85% depth of discharge gives roughly 850Wh of usable energy — about 13 hours for a 65W laptop or 8 hours for a 100W TV. Send us your load list and we can give a more accurate estimate.","eCandle 系列基础机型。1004Wh 磷酸铁锂电芯配 300W 额定交流输出，覆盖路由器、笔记本、照明与小型家电；光伏输入 220W／12~60V，交流输出支持 110V 与 220-240VAC。":"The entry model of the eCandle series. 1004Wh LiFePO4 cells with 300W rated AC output, covering routers, laptops, lighting and small appliances; solar input 220W / 12~60V, and AC output supporting 110V and 220-240VAC.","现场展示的重点是「设备 + 云平台」的完整链路：整机通过 4G / WiFi 上传发电与用电数据，配合 PAYG 云管理平台做远程监控与计费。对海外渠道商来说，这套链路决定了设备能否以租代售、按需付费。":"What we showed on site was the full device + cloud platform loop: the unit uploads generation and consumption data over 4G / WiFi, working with the PAYG cloud platform for remote monitoring and billing. For overseas channel partners, this loop determines whether the device can be rented out instead of sold, and billed on demand.","注：参数取自 40、60W 便携光伏板规格书（2026 Edition），一份规格书同时覆盖 40W 与 60W 两个功率档。光伏板输出为 USB-C，接入整机前请确认机型的输入接口与最大光伏输入功率。":"Note: figures from the 40, 60W portable solar panel spec sheet (2026 Edition) — one sheet covers both the 40W and 60W classes. The panel outputs USB-C; before connecting it to a main unit, confirm the model's input connector and maximum solar input power.","注：参数取自 eCandle DC-DC 规格书（2026 Edition，版本日期 2026-09-29）。本机型不含交流逆变输出，且规格书标注 2026 Q4 上市，选购前请确认负载类型与上市时间。":"Note: figures from the eCandle DC-DC spec sheet (2026 Edition, version date 2026-09-29). This model has no AC inverter output, and the spec sheet lists a 2026 Q4 launch — confirm your load type and the launch timing before ordering.","UniCore 系列功率顶配。2008Wh 容量搭配 1200W 交流输出与 600W MPPT 光伏输入，交流输出 2 路，可带动空调、电锤等启动冲击较大的负载。规格书标注 2026 Q4 上市。":"The top of the UniCore series. 2008Wh capacity with 1200W AC output and 600W MPPT solar input, 2 AC outputs, able to drive loads with heavy start-up surges such as air conditioners and rotary hammers. The spec sheet lists a 2026 Q4 launch.","与 eCandle 1 同为 300W 档，改用更紧凑的 272 × 135 × 195mm 机身，重量仍为 ≈10kg。直流输出为 5521 与 USB-A，另可选装 WiFi / 4G 模块。":"In the same 300W class as the eCandle 1, but in a more compact 272 × 135 × 195mm body, still weighing ≈10kg. DC outputs are 5521 and USB-A, with an optional WiFi / 4G module.","Energy as a Service（EaaS）亚非拉离网地区普惠型能源解决方案：eCandle、eGate、eNodeHub 三阶段环环相扣——节点越多，数据越可信，碳价值越高，网络扩张越快。":"Energy as a Service (EaaS) — an affordable energy solution for off-grid regions across Asia, Africa and Latin America: eCandle, eGate and eNodeHub interlock in three stages — more nodes mean more trustworthy data, higher carbon value and faster network expansion.","半固态电芯的磁吸充电宝，靠近即自动对位，吸附即充。102 × 66 × 8.5mm 机身可放进衬衫口袋；15W 磁吸无线输出，Type-C 支持 20W 输出与 18W 输入，另有蓝牙遥控功能。":"A magnetic power bank with semi-solid-state cells — it aligns automatically as it approaches and charges as it snaps on. The 102 × 66 × 8.5mm body fits in a shirt pocket; 15W magnetic wireless output, Type-C supporting 20W output and 18W input, plus Bluetooth remote control.","不含交流逆变环节的纯直流机型，320Wh 容量、≈3.5kg 重量，适合只给路由器、摄像头、照明与 USB 设备供电的场景。100W 光伏输入可做长期离网补电，规格书标注 2026 Q4 上市。":"A DC-only model with no AC inverter stage — 320Wh capacity and ≈3.5kg, suited to powering routers, cameras, lighting and USB devices only. 100W solar input supports long-term off-grid top-ups; the spec sheet lists a 2026 Q4 launch.","注：参数取自 eCandle Pro 规格书（2026 Edition）。规格书按 AC+DC 与 AC+AC 两个型号并列参数，直流输出列仅 AC+DC 配置提供，AC+AC 一列为「/」。":"Note: figures from the eCandle Pro spec sheet (2026 Edition). The sheet lists the AC+DC and AC+AC models side by side; the DC output rows are given only for the AC+DC configuration, with a slash in the AC+AC column.","从实验室样机到当地家庭，中间隔的不只是运输距离。高温、粉尘与电压波动都在考验整机的可靠性，这次部署也是我们检验产品在真实离网环境下表现的一次机会。后续我们会把运行数据整理成技术简报对外发布。":"Between a lab prototype and a local household lies more than shipping distance. Heat, dust and voltage fluctuations all test the unit's reliability, and this deployment is also our chance to see how the product performs in a real off-grid environment. We will compile the operating data into a technical brief and publish it later.","需要确认三点：接口形式能否与机型的直流输入对接、板的总功率是否超过机型的最大光伏输入，以及输入端电压范围是否落在规格书标称区间内。满足条件即可接入，白天发的电优先充入电池，再供给负载。":"Three things to confirm: whether the connector type matches the unit's DC input, whether the panel's total power exceeds the unit's maximum solar input, and whether the input voltage range falls within the range stated in the spec sheet. Once those are met you can connect it — power generated during the day charges the battery first, then supplies the loads.","面向更大容量与更高功率需求。单机 1004–2008Wh，交流输出均为 2 路；UniCore 1200 支持 1200W 交流输出与 600W 光伏输入，覆盖空调与动力工具类负载。":"For greater capacity and higher power. A single unit covers 1004–2008Wh, with 2 AC outputs across the series; the UniCore 1200 supports 1200W AC output and 600W solar input, covering air conditioners and power tools.","可以。光伏板可单独在售，但需要与整机的光伏输入接口和功率上限匹配。光伏板规格书标注输出接口为 USB-C（可选 USB-C + DC35135），选型前请先确认机型参数与接口形式。":"Yes. The panels can be sold on their own, but they must match the unit's solar input connector and power ceiling. The panel spec sheet lists the output as USB-C (optional USB-C + DC35135), so confirm the model's parameters and connector type before choosing.","先看用电量，再看补电条件。随身补电选充电宝系列；家庭备电、有光伏补电条件选 eCandle 系列；需要更大容量或带动空调一类大功率负载选 UniCore 系列；光伏板归在配件系列。":"Look at consumption first, then at charging conditions. For on-the-go top-ups choose the power bank series; for home backup with solar charging choose the eCandle series; for more capacity or heavy loads such as air conditioners choose the UniCore series; portable panels sit in the accessory series.","把容量提到 2008Wh，输出仍为 500W，交流输出 2 路。规格书尺寸 368 × 160 × 268mm、≈18kg，适合需要长时间带动中小负载、但功率需求不高的场景。":"Capacity rises to 2008Wh while output stays at 500W, with 2 AC outputs. The spec sheet gives 368 × 160 × 268mm and ≈18kg, suited to running small and medium loads for long periods where high power is not needed.","面向随身补电场景。半固态电芯，机身 102 × 66 × 8.5mm；15W 磁吸无线输出，Type-C 输出 20W Max、输入 18W Max，另有蓝牙遥控功能。":"For on-the-go top-ups. Semi-solid-state cells in a 102 × 66 × 8.5mm body; 15W magnetic wireless output, Type-C output 20W Max and input 18W Max, plus Bluetooth remote control.","认定依据包括核心技术的自主知识产权、研发投入占比与研发人员比例等指标。截至目前公司累计申请与授权专利超过 100 项，覆盖电池管理、双向逆变、光伏跟踪与云平台等方向。":"The assessment covers independently owned core technology, R&D spending ratio and the proportion of R&D staff, among other indicators. To date the company has filed and been granted more than 100 patents, covering battery management, bidirectional inversion, solar tracking and the cloud platform.","UniCore 系列入门机型，1004Wh 磷酸铁锂电芯配 500W 交流输出与 500W MPPT 光伏输入，交流输出 2 路。规格书标注 2027 Q1 上市。":"The entry model of the UniCore series: 1004Wh LiFePO4 cells with 500W AC output and 500W MPPT solar input, and 2 AC outputs. The spec sheet lists a 2027 Q1 launch.","此前 Energy Nex 已先后获得 2023 年红点设计奖与 2024 年法国设计奖金奖。设计奖项之外，我们更看重的是这些取舍是否让安装与日常使用变得更简单。":"Energy Nex had already won the 2023 Red Dot Design Award and the 2024 French Design Gold Award. Beyond design awards, what matters more to us is whether these trade-offs make installation and daily use simpler.","联合实验室覆盖：燃烧实验室 · 电子电气实验室 · EMS 实验室 · 雷击实验室 · 老化实验室 · 机械可靠性实验室 · 高加速寿命实验室 · 半消音实验室":"The joint laboratory covers: combustion · electrical and electronic · EMS · lightning · aging · mechanical reliability · highly accelerated life · semi-anechoic chambers","IP67 防护等级，雨雾环境可正常使用；板体厚 3mm，40W 折叠后 290 × 216 × 30.5mm，60W 为 290 × 220 × 30.5mm。":"IP67 rated for use in rain and mist; the panel is 3mm thick, folding to 290 × 216 × 30.5mm for the 40W and 290 × 220 × 30.5mm for the 60W.","UniCore 系列参数取自各自规格书（2026 Edition）；上市时间分别为 2026 Q4（500 Pro / 1200）与 2027 Q1（500）。":"UniCore series figures come from the respective spec sheets (2026 Edition); launch dates are 2026 Q4 (500 Pro / 1200) and 2027 Q1 (500).","亮相德国 Intersolar、巴西 Intersolar 南美展与沙特 The Solar Show KSA，发布 FT3600 移动电站及智能并机方案。":"Appeared at Intersolar Germany, Intersolar South America in Brazil and The Solar Show KSA in Saudi Arabia, launching the FT3600 mobile power station and smart paralleling solution.","参展美国 Consumer Electronics Show 2024 与香港 Web3 展会，对外展示储能 + AI 创新方案与 ECS 智能电控系统。":"Exhibited at CES 2024 in the United States and the Hong Kong Web3 event, presenting storage + AI innovations and the ECS smart electronic control system.","品牌主力系列。全系磷酸铁锂电芯与 ≥6000 次循环，覆盖 320Wh–1004Wh 容量区间，光伏输入 100–500W，支持 ≤10ms 无缝切换。":"The brand's flagship series. LiFePO4 cells and ≥6000 cycles across the line, covering 320Wh–1004Wh, solar input of 100–500W and ≤10ms seamless switching.","完成 50 万套设备试点；搭建本地运维团队与欧盟众筹平台；实现 30% 本地化组装生产；完成 Verra 碳积分认证，年交易量达 66 万吨 CO₂。":"Completed a 500,000-unit pilot; built a local operations team and a European crowdfunding platform; achieved 30% localized assembly; completed Verra carbon credit certification with annual trading volume of 660,000 tonnes CO₂.","光伏板规格书未列并联使用说明，因此暂不建议直接并联多块板。需要更大补电功率时，请按机型的最大光伏输入选配功率合适的单块板，或与我们确认方案后再施工。":"The panel spec sheet does not describe parallel operation, so we do not currently recommend connecting several panels in parallel. If you need more charging power, choose a single panel whose power suits the unit's maximum solar input, or confirm the plan with us before installing.","全球超 10 亿人口没有稳定电力，AI 与算力又正在引发全球用电荒；而离网绿电若无法被证明，就进不了碳市场——这三道裂缝，正是普惠型能源方案的机会。":"More than 1 billion people worldwide lack reliable power, while AI and computing are triggering a global electricity crunch; and off-grid green power that cannot be proven cannot enter the carbon market — these three fractures are exactly where affordable energy solutions find their opportunity.","注：参数取自 ChromMag 规格书（2026 Edition）。无线充电实际功率受手机型号与保护壳厚度影响；该规格书未列认证栏，认证信息待补。":"Note: figures from the ChromMag spec sheet (2026 Edition). Actual wireless charging power depends on the phone model and case thickness; the sheet has no certification row, so certification details are pending.","2024 年 9 月签署战略协议，2025 年 3 月成立联合实验室，2025 年 6 月完成合作项目批量交付——研发、认证与制造能力全面拉通。":"A strategic agreement signed in September 2024, a joint laboratory established in March 2025, and volume delivery of the joint project completed in June 2025 — aligning R&D, certification and manufacturing capability across the board.","目标市场：印度尼西亚、肯尼亚、卢旺达、尼日利亚、坦桑尼亚、乌干达、赞比亚（民用电价 ≥ 0.2 美元 / 度）。覆盖规模：累计 50 万户家庭。":"Target markets: Indonesia, Kenya, Rwanda, Nigeria, Tanzania, Uganda, Zambia (residential electricity ≥ USD 0.2 / kWh). Coverage: 500,000 households in total.","未来，斐石科技将持续致力于成为全球领先的普惠型绿色能源运营平台，实现商业价值与社会价值的统一，让全球每一个家庭都能用上平价、清洁、稳定的电力。":"Looking ahead, Faith Technology will keep working to become a leading global platform for affordable green energy operations, uniting commercial and social value so that every household worldwide can access affordable, clean and stable power.","目标市场：菲律宾、孟加拉等东南亚、南亚高电价低覆盖率国家；巴西、秘鲁、玻利维亚等拉美离网储能刚需市场。覆盖规模：累计突破 200 万户家庭。":"Target markets: high-tariff, low-coverage countries in Southeast and South Asia such as the Philippines and Bangladesh; and off-grid storage markets with hard demand in Latin America such as Brazil, Peru and Bolivia. Coverage: more than 2 million households in total.","通过官方渠道采购的整机与配件享有限期质保，具体年限与范围见售后政策页。OEM / ODM 与项目订单以合同约定为准，两者不一致时以合同为准。":"Units and accessories purchased through official channels carry limited warranty; see the warranty policy page for specific terms and coverage. OEM / ODM and project orders follow the contract, and the contract prevails where the two differ.","评审关注的是家用储能产品如何在不牺牲散热与安全的前提下融入室内环境。我们在整机的分色、把手与指示灯上做了多轮迭代，让设备不像一台工业机柜。":"The review focused on how a home energy storage product can blend into an interior without compromising heat dissipation or safety. We iterated several rounds on the two-tone finish, handle and indicators so the unit does not look like an industrial cabinet.","展台以「从一度电到一套系统」为主题，展示 eCandle 系列整机、便携光伏板与云管理平台的组合方案，现场演示了市电中断后的自动切换过程。":"The booth theme was from one kilowatt-hour to a whole system, showing the eCandle series, portable solar panels and cloud management platform as a combined solution, with a live demonstration of automatic switching after a grid outage.","FT3600 面向户外与应急场景，重点解决无市电条件下的持续补电问题。整机支持光伏、车载与市电三路输入，可按照使用环境灵活选择补电方式。":"The FT3600 targets outdoor and emergency scenarios, focused on continuous charging without grid power. The unit supports solar, vehicle and mains inputs, so the charging method can be chosen to suit the environment.","2026 年欧盟 CBAM 全面落地，绿电碳资产成为全球最稀缺的资产之一。但离网绿电无法被证明，就无法进入碳市场——这才是真正的裂缝。":"With the EU CBAM fully in force in 2026, green-power carbon assets are becoming among the scarcest assets globally. But off-grid green power that cannot be proven cannot enter the carbon market — that is the real fracture.","本规格书覆盖 eCandle Pro 的完整技术参数，包含输入与输出、电池参数、一般参数及保护功能明细，可直接用于选型对比与投标资料。":"This spec sheet covers the complete technical parameters of the eCandle Pro, including input and output, battery parameters, general parameters and protection functions, and can be used directly for selection comparison and tender documents.","尼日利亚阿南布拉州的一个坐标点上，一台 eCandle 已连续稳定运行。当地电网供电不稳定，家庭与小型商户长期依赖柴油发电机作为补充。":"At a set of coordinates in Anambra State, Nigeria, an eCandle has been running continuously and reliably. The local grid is unstable, and households and small businesses have long relied on diesel generators as backup.","输出均为 USB-C，可选 USB-C + DC35135 双接口；40W 重 1.1kg、60W 重 1.5kg，按补电需求二选一。":"Both output USB-C, with an optional USB-C + DC35135 dual interface; the 40W weighs 1.1kg and the 60W 1.5kg — choose one according to your charging needs.","FT3600 亮相北斗户外产品发布会；携 eCandle、Energy Nex、Energy Nex Pro 参展 2024 高交会。":"The FT3600 appeared at the BeiDou outdoor product launch; the eCandle, Energy Nex and Energy Nex Pro were exhibited at the 2024 CHTF.","储能产品属于含锂电池货物，全系通过 UN38.3 运输安全认证，可按空运与海运的常规要求安排运输，具体包装与文件要求以货代确认为准。":"Energy storage products are lithium-battery goods; the whole range passes UN38.3 transport safety certification and can be shipped by air and sea under standard requirements. Specific packaging and documentation requirements are subject to confirmation by the freight forwarder.","全球头部 AI 平台合计请求量 ≈ 134 亿次 / 月，约 40 GWh / 月，≈ 130 万户家庭单日用电。算力的未来是能源。":"Combined request volume across leading global AI platforms is ≈ 13.4 billion times / month, about 40 GWh / month, ≈ the daily consumption of 1.3 million households. The future of computing is energy.","佛山分公司承担供应链与制造协同职能，与深圳总部的研发团队形成前后端分工：深圳负责定义与迭代，佛山负责把定义稳定地做成可量产的产品。":"The Foshan branch handles supply chain and manufacturing coordination, dividing work with the Shenzhen R&D team: Shenzhen defines and iterates, Foshan turns those definitions reliably into mass-producible products.","按贸易条款（如 FOB / CIF / DDP）确定。我们可协助提供清关文件与关税测算，目的港清关与关税的承担方以合同条款为准。":"Determined by the trade term (such as FOB / CIF / DDP). We can help with customs documents and tariff estimates; responsibility for destination customs clearance and duties follows the contract terms.","对 eCandle 系列来说，这类组合方案是「设备之外」的增量价值——在离网场景里，用电和通信往往不是两个需求，而是同一个需求。":"For the eCandle series, this kind of combined solution is value beyond the device itself — in off-grid settings, power and connectivity are often not two needs but one.","双方将在离网通信与应急供电场景展开合作，把储能设备与卫星通信终端组合成可快速部署的应急方案，用于自然灾害后的临时通信与供电保障。":"The two parties will cooperate on off-grid communications and emergency power, combining storage devices with satellite communication terminals into a rapidly deployable emergency solution for temporary communications and power after natural disasters.","全球超 10 亿人无稳定电力，涉及 1.8 亿户家庭；能源开支占家庭收入 25–30%；非洲撒哈拉以南离网人口达 5.9 亿。":"More than 1 billion people worldwide lack reliable power, across 180 million households; energy spending takes 25–30% of household income; the off-grid population in sub-Saharan Africa reaches 590 million.","形成可复制的「公益 + 市场」援助模式；对接区域电力交易市场，参与全球碳交易体系；数据资产赋能金融、保险、社区服务等衍生生态。":"Forming a replicable public-good plus market assistance model; connecting to regional power trading markets and joining the global carbon trading system; and using data assets to enable derivative ecosystems such as finance, insurance and community services.","在紧凑机身里把交流输出提到 500W、光伏输入提到 500W。带 LED 照明功能，工作温度 0~50℃，适合户外与临时点位。":"Squeezing 500W AC output and 500W solar input into a compact body. With LED lighting and an operating temperature of 0~50℃, suited to outdoor and temporary sites.","充电宝是 2026 年新增品类，更多容量与形态版本在规划中；无线充电实际功率受手机型号与保护壳厚度影响。该规格书未列认证栏。":"Power banks are a new category added in 2026, with more capacity and form-factor versions in planning; actual wireless charging power depends on the phone model and case thickness. The sheet has no certification row.","发布会现场演示了光伏输入与整机输出的联动逻辑：白天发电优先充入电池，夜间按负载需求放电，以此把白天的日照转成夜间的可用电量。":"The launch event demonstrated how solar input and unit output work together: power generated during the day charges the battery first and is discharged at night according to load demand, turning daytime sunlight into usable night-time energy.","与行业龙头麦格米特（002851.SZ）签署战略协议，2025.03 成立联合实验室，2025.06 完成合作项目批量交付。":"A strategic agreement signed with industry leader Megmeet (002851.SZ), a joint laboratory established in 2025.03, and volume delivery of the joint project completed in 2025.06.","UN38.3 运输安全认证（全系） · CE 欧盟合规仅 eCandle 1 / Pro · 支持 OEM / ODM 定制":"UN38.3 transport safety certification (whole range) · CE EU compliance only for eCandle 1 / Pro · OEM / ODM customization supported","采用磷酸铁锂电芯，循环寿命 ≥6000 次。按每天一次完整充放计算可用 10 年以上；日常只用掉部分电量时，寿命还会更长。":"LiFePO4 cells with a cycle life of ≥6000. At one full charge-discharge per day that is more than 10 years of use; when only part of the capacity is used each day, the life is even longer.","整机按室内干燥环境设计，建议放在通风、避免阳光直射的位置，并留出散热空间。需要户外或半户外安装时，请先与我们确认防护方案。":"The unit is designed for indoor dry environments; place it in a ventilated spot out of direct sunlight and leave room for heat dissipation. For outdoor or semi-outdoor installation, confirm the protection plan with us first.","不需要。设备在市电与电池之间自动切换，eCandle Pro 的切换时间 ≤10ms，路由器与台式机不会因为跳电而重启。":"No. The device switches automatically between mains and battery, and the eCandle Pro switches in ≤10ms, so routers and desktop computers will not restart when power drops.","支持外观工艺、铭牌、包装与软件界面的定制。起订量与开模费用按机型与定制项评估，整柜订单可议价，请联系我们索取专属报价单。":"We support customization of exterior finish, nameplate, packaging and software interface. Minimum order quantity and tooling costs are assessed by model and customization item; full-container orders are negotiable — contact us for a dedicated quotation.","注：参数取自 UniCore 500 Pro 规格书（2026 Edition）。规格书标注上市时间为 2026 Q4。":"Note: figures from the UniCore 500 Pro spec sheet (2026 Edition). The sheet lists a 2026 Q4 launch.","通过联系页面提交机型、序列号、故障现象与照片或视频。工作日 24 小时内响应，判断是远程处理、备件寄送还是返厂维修。":"Submit the model, serial number, symptoms and photos or video via the contact page. We respond within 24 hours on business days and decide whether to handle it remotely, send a spare part, or have it returned for repair.","无线充输出 15W Max，Type-C 输出 20W Max、输入 18W Max；插线时优先有线供电，效率更高。":"Wireless charging output 15W Max, Type-C output 20W Max and input 18W Max; when plugged in, wired power takes priority for better efficiency.","5521、USB-A 各 2 路，另有双向 Type-C1 65W 与 Type-C2 20W，共 6 路输出口。":"5521 and USB-A × 2 each, plus bidirectional Type-C1 65W and Type-C2 20W — 6 output ports in total.","建立区域运营中心，实现 50% 本地化生产；碳积分年交易量突破 264 万吨；数据资产初具规模，启动能源金融试点。":"Establish regional operations centres and achieve 50% localized production; annual carbon credit trading exceeds 2.64 million tonnes; data assets take shape and an energy finance pilot begins.","建议保持 50%–60% 电量后关机存放，放在阴凉干燥处，并每隔 3–6 个月补一次电，避免长期亏电导致容量衰减。":"Store powered off with 50%–60% charge in a cool, dry place, and top up every 3–6 months to avoid capacity loss from prolonged depletion.","磷酸铁锂在高温下更稳定，但低温会降低可用容量与充电接受能力。具体工作温度范围与降额曲线请查阅对应机型的规格书正文。":"LiFePO4 is more stable at high temperatures, but low temperatures reduce usable capacity and charge acceptance. For specific operating temperature ranges and derating curves, see the spec sheet of the relevant model.","四个系列、12 款机型。从随身充电宝到两度电组网储能，共用同一套磷酸铁锂平台与安全标准，可按用电量与场景组合选型。":"Four series, 12 models. From a pocket power bank to two-kilowatt-hour networked storage, all sharing one LiFePO4 platform and safety standard, so you can choose by consumption and scenario.","注：参数取自 eCandle 3 规格书（2026 Edition）参数表。认证栏只列 UN38.3，不含 CE。":"Note: figures from the parameter table of the eCandle 3 spec sheet (2026 Edition). The certification row lists UN38.3 only, without CE.","高交会期间，我们与多家海外渠道商就东南亚与非洲市场的准入要求做了初步对接，包括认证清单、包装要求与本地售后安排。":"During the CHTF we made initial contact with several overseas channel partners on market access requirements for Southeast Asia and Africa, including certification lists, packaging requirements and local after-sales arrangements.","这次参展帮助我们校准了产品定义中的区域差异——同一套硬件平台，在不同市场需要不同的端口配置、认证清单与软件策略。":"This exhibition helped us calibrate regional differences in product definition — the same hardware platform needs different port configurations, certification lists and software strategies in different markets.","注：参数取自 UniCore 500 规格书（2026 Edition）。规格书标注上市时间为 2027 Q1。":"Note: figures from the UniCore 500 spec sheet (2026 Edition). The sheet lists a 2027 Q1 launch.","我们同期发布了面向渠道伙伴的 PAYG 合作模式说明，把「设备销售」与「按需付费」两种模式并列提供给不同市场。":"We also released a PAYG partnership model for channel partners at the same time, offering device sales and pay-as-you-go side by side to different markets.","新型 BC 电池，转换效率最高 24.8%，同样面积比常规组件多发电；40W 与 60W 共用同一套电池工艺。":"New BC cells with up to 24.8% conversion efficiency generate more power than conventional modules of the same area; the 40W and 60W share the same cell process.","展会期间我们与来自东南亚、非洲与中东的渠道伙伴就本地化部署做了多轮沟通，重点讨论安装方式、结算周期与售后响应。":"During the show we held several rounds of discussion with channel partners from Southeast Asia, Africa and the Middle East on localized deployment, focusing on installation methods, settlement cycles and after-sales response.","亮相香港 Web3 嘉年华并登上主会场圆桌，提出新能源为底座、物联网为神经、Web3 为引擎的三位一体架构。":"Appeared at Hong Kong Web3 Carnival and joined the main-stage round table, proposing a trinity architecture with new energy as the foundation, IoT as the nerves and Web3 as the engine.","eCandle 系列累计交付超过 10 万台，你的改动会真实地出现在海外家庭的墙边，而不是停在 PPT 里。":"The eCandle series has delivered more than 100,000 units; your changes will genuinely appear on walls in overseas homes rather than stopping at a slide deck.","日常不需要拆机维护。建议每季度检查一次散热口是否积尘、线缆与接头是否松动，并通过管理平台确认电池健康状态。":"No disassembly is needed for routine maintenance. Check quarterly for dust in the vents and loose cables or connectors, and confirm battery health through the management platform.","质保范围、退换货规则与维修流程。适用于通过官方渠道采购的 eCandle、UniCore 整机与配件产品。":"Warranty coverage, return and exchange rules, and the repair process. Applies to eCandle and UniCore units and accessories purchased through official channels.","2026 Edition · 完整技术参数、保护功能与认证信息。支持在线查看，或下载 PDF 版本存档。":"2026 Edition · Complete technical parameters, protection functions and certification information. View online, or download the PDF for your records.","北美市场对家庭备电的需求与欧洲、非洲明显不同：更关注与既有屋顶光伏系统的兼容性、并网接口与本地电气规范。":"Demand for home backup in North America differs markedly from Europe and Africa: more focus on compatibility with existing rooftop solar systems, grid-tie interfaces and local electrical codes.","PDF 文件：specs/ecandle-pro.pdf · 点击按钮直接下载，也可在浏览器内打开预览。":"PDF file: specs/ecandle-pro.pdf · Click the button to download directly, or open a preview in your browser.","我们在深圳做一件很具体的事：把一度电做成能卖到海外家庭里的产品。硬件、软件、供应链与海外渠道都在扩编。":"We do something very concrete in Shenzhen: turning one kilowatt-hour into a product that reaches family homes overseas. Hardware, software, supply chain and overseas channels are all expanding.","AC+DC：Type-C 20W Max（×1） · USB-A 10W Max，合计 15W（×2）":"AC+DC: Type-C 20W Max (×1) · USB-A 10W Max, 15W total (×2)","目标市场：覆盖全球主要发展中经济体，并探索与欧美成熟市场合作。覆盖规模：累计服务 500 万户家庭。":"Target markets: major developing economies worldwide, while exploring partnerships in mature European and American markets. Coverage: 5 million households served in total.","Type-C 18W Max（×2）与 USB-A 18W Max（×2），四口同时给移动设备快充。":"Type-C 18W Max (×2) and USB-A 18W Max (×2) — fast-charge four mobile devices at once.","对团队来说，这个称号的意义在于确认了「把电芯、变换、算法与平台放在同一支团队里做」这条路的可行性。":"For the team, the significance of this title is that it confirms the viability of building cells, power conversion, algorithms and the platform within a single team.","额定交流输出 300W，支持 110V 与 220-240VAC 两种输出制式，适配不同出口市场。":"Rated AC output 300W, supporting both 110V and 220-240VAC output systems to suit different  Max (×1) · USB-A 10W Max, 15W total (×2)","2025 年 3 月与麦格米特成立联合实验室，测试与验证资源可直接调用，不用排队等外协。":"A joint laboratory was established with Megmeet in March 2025, giving direct access to testing and validation resources without queuing for external labs.","272 × 135 × 195mm 的立式机身，占地更小，适合柜内、桌下与狭窄位置安装。":"A 272 × 135 × 195mm upright body that takes up less floor space, suited to cabinets, under desks and narrow positions.","储能硬件、BMS、云平台与 App 由同一支团队负责，方案不用在多个供应商之间来回对齐。":"Storage hardware, BMS, cloud platform and app are handled by one team, so the solution does not need to be aligned back and forth across multiple suppliers.","光伏输入 500W／12~60V，配 MPPT 跟踪；市电、光伏、车载三路输入自动切换。":"Solar input 500W / 12~60V with MPPT tracking; mains, solar and vehicle inputs switch automatically.","四个系列、12 款机型在线询价。支持整机、配件与便携光伏板单独采购，也可按场景组合报价。":"Four series and 12 models available for enquiry online. Units, accessories and portable solar panels can be purchased separately, or quoted as a scenario bundle.","逐项对比各机型的输入、输出、电池与整机参数，数值取自 2026 Edition 规格书。":"Compare the input, output, battery and general parameters of each model item by item; figures come from the 2026 Edition spec sheets.","≥6000 次充放循环，容量衰减更平缓；高温环境下更稳定，适合长期驻留家庭与户外场景。":"≥6000 charge-discharge cycles with gentler capacity decay; more stable at high temperatures, suited to long-term use in homes and outdoor settings.","分公司的设立让样机迭代与小批量试产的周期明显缩短，也让供应链问题能在更早的阶段被发现。":"Setting up the branch noticeably shortened prototype iteration and small-batch trial production cycles, and let supply chain issues surface at an earlier stage.","光伏输入电压范围 12~60V，配 MPPT 跟踪；市电、光伏、车载三路输入自动切换。":"Solar input voltage range 12~60V with MPPT tracking; mains, solar and vehicle inputs switch automatically.","首批设备在阿南布拉州稳定运行，可通过设备编号与位置记录追溯，海外部署进入试点落地阶段。":"The first units are running reliably in Anambra State and can be traced by device number and location records; overseas deployment has entered the pilot stage.","下表为通用条款。OEM / ODM 与项目订单以合同约定为准，两者不一致时以合同为准。":"The table below gives /* 归一化：与词表抽取口径完全一致（&nbsp;→空格、空白折叠、去首尾） */
function normTxt(v){
  return String(v).replace(/\u00A0/g, ' ').replace(/\s+/g, ' ').trim();
}
/* 取译文；命中则返回英文，否则原样返回 */
function T(s){
  if(LANG !== 'en' || s == null) return s;
  var t = EN[normTxt(s)];
  return (t == null) ? s : t;
}

    + '<span class="lang__sep"></span>'

    + '</div>';
}

/* 遍历 DOM，把文本节点与常用属性替换为英文 */
var ATTR_I18N = ['placeholder', 'title', 'alt'];
function translateTree(root){
  if(LANG !== 'en' || !root) return;
  var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), ns = [], n;
  while((n = w.nextNode())){ ns.push(n); }
  for(var i = 0; i < ns.length; i++){
    var v = ns[i].nodeValue;
    if(!v) continue;
    var k = normTxt(v);
    if(!k) continue;
    var t = EN[k];
    if(t == null){
      /* 分页/体积元信息：PDF · 4 页 · 0.73 MB —— 页码与体积随文档变化，用规则兜底 */
      var pm = k.match(/^PDF · (\d+) 页 · (.+)$/);
      if(pm) t = 'PDF · ' + pm[1] + ' pages · ' + pm[2];
    }
    if(t == null && v.indexOf('\u3000') >= 0){
      /* 模板自带的全角空格分隔符（如 `{{en}}　/　SERIES`）：原文除全角空格与全角标点外
         已无中文时，直接换成半角空格 —— 含中文的整句不走这条，避免误伤待译内容。 */
      var probe = v.replace(/\u3000/g, '');
      if(!/[\u4e00-\u9fff\uff01-\uff5e\u3001\u3002\u201c\u201d\u2018\u2019]/.test(probe)){
        ns[i].nodeValue = v.replace(/\u3000/g, ' ').replace(/ {2,}/g, ' ');
        continue;
      }
    }
    if(t != null) ns[i].nodeValue = t;
  }
  for(var a = 0; a < ATTR_I18N.length; a++){
    var at = ATTR_I18N[a], els = root.querySelectorAll('[' + at + ']');
    for(var q = 0; q < els.length; q++){
      var av = normTxt(els[q].getAttribute(at) || '');
      if(av && EN[av] != null) els[q].setAttribute(at, EN[av]);
    }
  }
}

  if(page.route === 'product' && PRODUCTS[page.param]) return 'Product — ' + T(PRODUCTS[page.param].name);

}

/* 页头 / 页脚 / 走查条：随语言重绘 */
function renderChrome(){
  document.documentElement.lang = (LANG === 'en') ? 'en' : 'zh-CN';
  var h = document.getElementById('siteHeader'), f = document.getElementById('siteFooter');
  h.innerHTML = headerHTML();
  f.innerHTML = footerHTML();
  f.className = 'footer';
  translateTree(h); translateTree(f);
  document.querySelectorAll('[data-en]').forEach(function(el){
    if(!el.hasAttribute('data-zh')) el.setAttribute('data-zh', el.textContent);
    el.textContent = (LANG === 'en') ? el.getAttribute('data-en') : el.getAttribute('data-zh');
  });
}

function setLang(l){
  if(l !== 'zh' && l !== 'en') return;
  if(l === LANG) return;
  LANG = l;
  try { localStorage.setItem('foipower-lang', l); } catch(e){}
  renderChrome();
  render();
  gateRender();
  adminRender();
}

/* ============================================================
   排版小工具
   ============================================================ */
function kvRow(items){
  return '<div class="kv-row">' + items.map(function(it){
    return '<div class="kv"><span class="kv__k">' + it[0] + '</span><span class="kv__v">' + it[1] + '</span></div>';
  }).join('') + '</div>';
}
function factsRow(items){
  return '<div class="series-facts">' + items.map(function(it){
    return '<div class="series-fact"><span class="series-fact__k">' + it[0] + '</span>'
         + '<span class="series-fact__v">' + it[1] + '</span></div>';
  }).join('') + '</div>';
}
function featureCards(items){
  return '<div class="grid grid--3">' + items.map(function(f){
    return '<div class="card"><div class="card__icon">' + (ICONS[f[3]] || ICONS.bolt) + '</div>'
      + '<div class="card__title">' + f[0] + '</div>'
      + '<p class="card__desc">' + f[1] + '</p>'
      + '<div class="card__meta">' + f[2] + '</div></div>';
  }).join('') + '</div>';
}
function specTable(rows){
  return '<div class="spec-table">' + rows.map(function(r){
    return '<div class="spec-row spec-2"><div class="spec-cell spec-cell--key">' + r[0] + '</div>'
      + '<div class="spec-cell">' + r[1] + '</div></div>';
  }).join('') + '</div>';
}
function multiSpecTable(head, rows, cls){
  function row(cells, isHead){
    return '<div class="spec-row ' + (isHead ? 'spec-row--head ' : '') + cls + '">' + cells.map(function(c, i){
      return '<div class="spec-cell' + (i === 0 ? ' spec-cell--key' : '') + '">' + c + '</div>';
    }).join('') + '</div>';
  }
  return '<div class="spec-table">' + row(head, true) + rows.map(function(r){ return row(r, false); }).join('') + '</div>';
}
function policyRowsHTML(rows){
  return '<div class="policy">' + rows.map(function(r){
    return '<div class="policy__row"><div class="policy__k">' + r[0] + '</div>'
      + '<div class="policy__v">' + r[1] + '</div></div>';
  }).join('') + '</div>';
}
function bulletsHTML(list){
  return list.map(function(t){ return '<div>' + t + '</div>'; }).join('');
}
function rtListHTML(rows){
  return '<div class="rt-list">' + rows.map(function(r){
    return '<div class="rt-row"><span class="rt-row__dev">' + r[0] + '</span>'
      + '<span class="rt-row__val">' + r[1] + '</span></div>';
  }).join('') + '</div>';
}
function stepGridHTML(steps){
  return '<div class="step-grid">' + steps.map(function(s, i){
    return '<div class="step"><div class="step__n">STEP 0' + (i + 1) + '</div>'
      + '<div class="step__t">' + s[0] + '</div>'
      + '<p class="step__d">' + s[1] + '</p></div>';
  }).join('') + '</div>';
}
/* 机型卡 / 系列卡 */
function modelCards(ids, gridCls){
  return '<div class="grid ' + (gridCls || 'grid--3') + '">' + ids.map(function(id){
    var p = PRODUCTS[id];
    return '<a class="prod-card" href="#/product/' + id + '">'
      + phBox('product/' + id, '机型图', 'height:180px', 'prod-card__img')

function fillTpl(id, vars){
  var el = document.getElementById(id);
  if(!el){ return '<div class="sec"><div class="wrap">页面缺失</div></div>'; }
  return el.innerHTML.replace(/\{\{(\w+)\}\}/g, function(_, k){
    if(vars && vars[k] != null){ return vars[k]; }
    if(BUILDERS[k]){ return BUILDERS[k](vars || {}); }
    if(ICONS[k]){ return ICONS[k]; }
    return '';
  });
}

function currentRoute(){
  var h = (location.hash || '').replace(/^#\/?/, '');
  var target = '';
  var at = h.indexOf('@');
  if(at > -1){ target = h.slice(at + 1); h = h.slice(0, at); }
  var seg = h.split('/').filter(function(x){ return x !== ''; });
  if(!seg.length){ seg = ['home']; }
  return {seg:seg, route:seg[0], param:seg[1] || '', target:target, key:seg.join('/')};
}

function scrollToTarget(target){
  if(!target) return;
  var el = document.getElementById(target);
  if(el){
    var top = el.getBoundingClientRect().top + window.pageYOffset - 100;
    window.scrollTo({top:top, behavior:'smooth'});
  }
}
