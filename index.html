/* ---------- 交互（事件委托） ---------- */
document.addEventListener('click', function(e){
  /* 遮罩点击关闭（下载登记 / 新闻管理 两个弹窗） */
  if(e.target.classList && e.target.classList.contains('gate')){
    if(e.target.id === 'adminModal') adminClose(); else gateClose();
    return;
  }
  /* 新闻管理端 */
  var aClose = e.target.closest ? e.target.closest('[data-admin-close]') : null;
  if(aClose){ adminClose(); return; }
  var nNew = e.target.closest ? e.target.closest('[data-news-new]') : null;
  if(nNew){ if(adminAuthed()) adminNew(); else adminAuthAsk(); return; }
  var nAuth = e.target.closest ? e.target.closest('[data-news-auth]') : null;
  if(nAuth){ adminAuthAsk(); return; }
  var nExp = e.target.closest ? e.target.closest('[data-news-export]') : null;
  if(nExp){ adminExport(); return; }
  var nEdit = e.target.closest ? e.target.closest('[data-news-edit]') : null;
  if(nEdit){ e.preventDefault(); adminEdit(nEdit.getAttribute('data-news-edit')); return; }
  var nDel = e.target.closest ? e.target.closest('[data-news-del]') : null;
  if(nDel){ e.preventDefault(); adminDelete(nDel.getAttribute('data-news-del')); return; }
  var imgPick = e.target.closest ? e.target.closest('[data-img-pick]') : null;
  if(imgPick){
    var fi = document.querySelector('[data-img-file]');
    if(fi) fi.click();
    return;
  }
  var cpy = e.target.closest ? e.target.closest('[data-copy-json]') : null;
  if(cpy){
    var ta = document.querySelector('[data-export-ta]');
    if(ta){
      ta.removeAttribute('readonly'); ta.select(); ta.setSelectionRange(0, 999999);
      var done = false;
      try { done = document.execCommand('copy'); } catch(err){ done = false; }
      if(!done && navigator.clipboard){
        try { navigator.clipboard.writeText(ta.value); done = true; } catch(err2){ done = false; }
      }
      ta.setAttribute('readonly', 'readonly');
      toast(done ? T('复制成功。') : T('复制失败，请手动全选复制。'));
    }
    return;
  }
  /* 资料下载登记 */
  var gClose = e.target.closest ? e.target.closest('[data-gate-close]') : null;
  if(gClose){ gateClose(); return; }
  var gLink = e.target.closest ? e.target.closest('[data-gate]') : null;
  if(gLink){
    var gh = gLink.getAttribute('href') || '';
    var gd = (gLink.getAttribute('data-gate') === 'download') ? (gLink.getAttribute('data-gate-dl') || '') : '';
    e.preventDefault();   /* 一律接管默认跳转，否则放行后锚点会跳到虚拟路径 */
    if(gatePassed()){ gateState = {href:gh, dl:gd}; gateRun(); }
    else { gateOpen(gh, gd); }
    return;
  }
  /* 筛选 chip */

    chip.classList.add('is-active');
    var target = group.getAttribute('data-filter-target');
    if(target) applyFilter(target, chip.getAttribute('data-filter'));
    return;
  }
  /* 建议关键词 */
  var kwBtn = e.target.closest('[data-kw]');
  if(kwBtn){ goSearch(kwBtn.getAttribute('data-kw')); return; }
  /* FAQ */
  var faq = e.target.closest('[data-faq]');
  if(faq){ faq.parentElement.classList.toggle('is-open'); return; }
  /* 单选选项 */
  var opt = e.target.closest('[data-opt]');
  if(opt){
    var og = opt.closest('[data-opt-group]');
    og.querySelectorAll('[data-opt]').forEach(function(o){ o.classList.remove('is-active'); });
    opt.classList.add('is-active');
    return;
  }
  /* 客户线索后台 */
  var lOut = e.target.closest('[data-leads-logout]');
  if(lOut){ leadsLogout(); return; }
  var lRe = e.target.closest('[data-leads-reload]');
  if(lRe){ leadsLoad(true); return; }
  var lCsv = e.target.closest('[data-leads-csv]');
  if(lCsv){ leadsExportCSV(); return; }
  var lJson = e.target.closest('[data-leads-json]');
  if(lJson){ leadsExportJSON(); return; }
  var lDel = e.target.closest('[data-lead-del]');
  if(lDel){ leadsDelete(lDel.getAttribute('data-lead-del')); return; }
  /* 分页 */
  var pg = e.target.closest('[data-page]');
  if(pg){
    var wrapEl = pg.closest('.pager');
    wrapEl.querySelectorAll('[data-page]').forEach(function(b){ b.classList.remove('is-active'); });
    pg.classList.add('is-active');
    return;
  }
});

/* ============================================================
   Supabase 客户端（只依赖 fetch，不引任何外部脚本）
   ------------------------------------------------------------
   安全模型：
     · 写入 —— 匿名访客带 anon key 直接 POST。数据库 RLS 只放行
       INSERT，所以谁都能提交、谁也都读不出来。
     · 读取 —— 必须带管理员账号登录换来的真 JWT。RLS 里写死了
       允许的邮箱，没有账号就拿不到一条数据。
     · 密码只交给 Supabase 校验，不进网页代码。
   ============================================================ */
function sbReady(){ return !!(SUPABASE_CFG.url && SUPABASE_CFG.anonKey); }
function sbBase(){ return String(SUPABASE_CFG.url).replace(/\/+$/, ''); }
function sbEsc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c];
  });
}

var SB_SESS_KEY = 'foipower-leads-sess';
var sbSess = null;
try { sbSess = JSON.parse(localStorage.getItem(SB_SESS_KEY) || 'null'); } catch(e){ sbSess = null; }
if(sbSess && (!sbSess.refresh_token || !sbSess.access_token)) sbSess = null;

function sbSaveSess(s){
  sbSess = s;
  try {
    if(s){ localStorage.setItem(SB_SESS_KEY, JSON.stringify(s)); }
    else { localStorage.removeItem(SB_SESS_KEY); }
  } catch(e){}
}
function sbSigned(){ return !!(sbSess && sbSess.refresh_token); }
function sbNeedRefresh(){
  if(!sbSigned() || !sbSess.at) return false;
  return (Date.now() - sbSess.at) > ((sbSess.expires_in || 3600) * 1000 - 120000);
}

/* Supabase 两代密钥：旧版是 JWT（eyJ…），可同时放在 apikey 与 Authorization；
   新版是 sb_publishable_…，只能放 apikey 头，当 Bearer 用会被网关判为无效令牌。
   下面这套写法两种都能填，不用关心用户拿到的是哪一代。 */
function sbKeyIsLegacyJwt(){
  return String(SUPABASE_CFG.anonKey || '').slice(0, 3) === 'eyJ';
}
/* 统一出口：apikey 头必带；有登录会话时用会话令牌，否则按密钥代次决定要不要带 Authorization */
function sbApi(path, init, withAuth){
  var h = { 'apikey': SUPABASE_CFG.anonKey };
  var tok = (withAuth && sbSess && sbSess.access_token) ? sbSess.access_token : '';
  if(tok){ h['Authorization'] = 'Bearer ' + tok; }
  else if(sbKeyIsLegacyJwt()){ h['Authorization'] = 'Bearer ' + SUPABASE_CFG.anonKey; }
  var opt = { method: (init && init.method) || 'GET', headers: h };
  if(init && init.body != null){
    h['Content-Type'] = 'application/json';
    opt.body = init.body;
  }
  if(init && init.prefer){ h['Prefer'] = init.prefer; }
  return fetch(sbBase() + path, opt);
}
function sbJson(r){
  return r.json().catch(function(){ return {}; }).then(function(j){
    if(!r.ok){
      var m = j.error_description || j.msg || j.message || j.hint || j.error || ('HTTP ' + r.status);
      var e = new Error(String(m)); e.status = r.status; throw e;
    }
    return j;
  });
}

function sbSignIn(email, pwd){
  return sbApi('/auth/v1/token?grant_type=password', {
    method: 'POST', body: JSON.stringify({ email: email, password: pwd })
  }).then(sbJson).then(function(j){
    sbSaveSess({
      access_token:  j.access_token,
      refresh_token: j.refresh_token,
      at:            Date.now(),
      expires_in:    j.expires_in || 3600,
      email:         (j.user && j.user.email) || email
    });
    return true;
  });
}
function sbRefreshSession(){
  if(!sbSigned()) return Promise.reject(new Error('未登录'));
  return sbApi('/auth/v1/token?grant_type=refresh_token', {
    method: 'POST', body: JSON.stringify({ refresh_token: sbSess.refresh_token })
  }).then(sbJson).then(function(j){
    sbSaveSess({
      access_token:  j.access_token,
      /* 未开启 refresh token rotation 时服务端不下发新的，沿用旧的 */
      refresh_token: j.refresh_token || sbSess.refresh_token,
      at:            Date.now(),
      expires_in:    j.expires_in || 3600,
      email:         sbSess.email
    });
    return true;
  });
}
function sbSignOut(){
  var t = sbSess && sbSess.access_token;
  sbSaveSess(null);
  if(!t) return Promise.resolve();
  return fetch(sbBase() + '/auth/v1/logout', {
    method: 'POST',
    headers: { 'apikey': SUPABASE_CFG.anonKey, 'Authorization': 'Bearer ' + t }
  }).catch(function(){});
}
/* 需要身份的数据请求：临近过期先静默续期；续期失败说明会话已被吊销，
   直接清掉，让页面退回登录表单，而不是停在一个读不出数据的空壳上。 */
function sbAuthedFetch(path){
  var pre = sbNeedRefresh()
    ? sbRefreshSession().catch(function(){ sbSaveSess(null); })
    : Promise.resolve();
  return pre.then(function(){ return sbApi(path, {}, true); }).then(function(r){
    if((r.status === 401 || r.status === 403) && sbSigned()){
      return sbRefreshSession()
        .then(function(){ return sbApi(path, {}, true); })
        .catch(function(){
          sbSaveSess(null);
          throw new Error('登录已失效，请重新登录。');
        });
    }
    return r;
  });
}

/* 表单 → 数据库。只有服务器真回 201 才算成功 */
function sbInsertLead(d){
  if(!sbReady()){ return Promise.resolve(false); }
  /* Prefer: return=minimal 是关键：默认的 return=representation 会要求把新行
     读回来，而 RLS 没给匿名读权限，请求会被判违规直接失败。 */
  return sbApi('/rest/v1/' + SUPABASE_CFG.table, {
    method: 'POST',
    prefer: 'return=minimal',
    body: JSON.stringify({
      name:    d.fname,
      company: d.company,
      email:   d.email,
      phone:   d.phone,
      inquiry: d.type,
      message: d.msg,
      page:    (location.hash || '#/'),
      lang:    LANG
    })
  }).then(function(r){ return r.ok; }).catch(function(){ return false; });
}

function leadsHTML(){

function leadsLoginHTML(){

function leadsListInner(){
  if(leadsErr){
    return '<div class="card" style="max-width:760px">'
      + '<div class="card__title">' + T('读取失败') + '</div>'
      + '<p class="form-note" style="margin:12px 0 20px">' + sbEsc(leadsErr) + '</p>'
      + '<div style="display:flex;gap:10px;flex-wrap:wrap">'
      +   '<button class="btn btn--secondary btn--sm" type="button" data-leads-reload>' + T('重试') + '</button>'
      +   '<button class="btn btn--secondary btn--sm" type="button" data-leads-logout>' + T('退出登录') + '</button>'
      + '</div></div>';
  }
  if(leadsData === null){ return '<p class="form-note">' + T('正在读取…') + '</p>'; }

  var n = leadsData.length;
  var dis = n ? '' : ' disabled';
  var bar = '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px">'
    + '<div style="font-size:14px;color:var(--t2)">' + T('共 {{n}} 条').replace('{{n}}', n) + '</div>'
    + '<div style="margin-left:auto;display:flex;gap:10px;flex-wrap:wrap">'
    +   '<button class="btn btn--secondary btn--sm" type="button" data-leads-reload>' + T('刷新') + '</button>'
    +   '<button class="btn btn--secondary btn--sm" type="button" data-leads-json' + dis + '>' + T('导出 JSON') + '</button>'
    +   '<button class="btn btn--primary btn--sm" type="button" data-leads-csv' + dis + '>' + T('导出 CSV') + '</button>'
    +   '<button class="btn btn--secondary btn--sm" type="button" data-leads-logout>' + T('退出登录') + '</button>'
    + '</div></div>';

  if(!n){ return bar + '<p class="form-note">' + T('还没有收到任何提交。') + '</p>'; }

  var cell = function(v, dim, nowrap){
    return '<td style="font-size:14px;padding:14px;border-bottom:1px solid #1B1F26;vertical-align:top;'
      + (dim ? 'color:var(--t2)' : 'color:var(--t1)') + ';' + (nowrap ? 'white-space:nowrap;' : '') + '">'
      + sbEsc(v) + '</td>';
  };
  var cols = ['提交时间', '姓名', '公司', '邮箱', '电话', '需求类型', '需求说明', '操作'];
  var thead = '<tr>' + cols.map(function(t){
    return '<th style="text-align:left;font-size:12px;font-weight:600;color:var(--t3);'
      + 'letter-spacing:.04em;padding:12px 14px;border-bottom:1px solid #22262E;white-space:nowrap">'
      + T(t) + '</th>';
  }).join('') + '</tr>';
  var rows = leadsData.map(function(r){
    return '<tr>'
      + cell(leadTime(r.created_at), true, true)
      + cell(r.name)
      + cell(r.company, true)
      + cell(r.email, true)
      + cell(r.phone, true)
      + cell(r.inquiry, true)
      + cell(String(r.message == null ? '' : r.message).replace(/\r?\n/g, ' '), true)
      + '<td style="padding:10px 14px;border-bottom:1px solid #1B1F26;vertical-align:top;text-align:right;white-space:nowrap">'
      +   '<button class="btn btn--secondary btn--sm" type="button" data-lead-del="' + sbEsc(String(r.id)) + '">' + T('删除') + '</button>'
      + '</td>'
      + '</tr>';
  }).join('');

  return bar
    + '<div style="overflow-x:auto;border:1px solid #22262E;border-radius:16px;background:#0E1014">'
    +   '<table style="border-collapse:collapse;width:100%;min-width:1040px">'
    +     '<thead>' + thead + '</thead><tbody>' + rows + '</tbody>'
    +   '</table></div>'
    + '<p class="form-note" style="margin-top:16px">'
    + T('最多显示最近 1000 条。数据存放在你的 Supabase 项目里，随时可以导出备份。')
    + '</p>';
}

function leadsPaint(){
  var box = document.getElementById('leadsLive');
  if(!box) return;                     /* 已离开该页，不重绘 */
  box.innerHTML = leadsListInner();
  translateTree(box);
}

function leadsLoad(force){
  if(!sbReady() || !sbSigned() || leadsBusy) return;
  leadsBusy = true; leadsErr = '';
  if(force){ leadsData = null; leadsPaint(); }
  sbAuthedFetch('/rest/v1/' + SUPABASE_CFG.table + '?select=*&order=created_at.desc&limit=1000')
    .then(function(r){
      if(r.status === 401 || r.status === 403){
        sbSaveSess(null);
        toast(T('登录已失效，或该账号不在允许名单内。'));
        throw new Error('登录已失效，或该账号不在允许名单内。');
      }
      if(!r.ok){ throw new Error('读取失败（HTTP ' + r.status + '）。'); }
      return r.json();
    })
    .then(function(rows){ leadsData = Array.isArray(rows) ? rows : []; })
    .catch(function(err){
      leadsErr = (err && err.message) ? err.message : '读取失败。';
      leadsData = [];
    })
    .then(function(){
      leadsBusy = false;
      if(!sbSigned()){ leadsTried = false; render(); return; }   /* 会话已失效 → 回登录页 */
      leadsPaint();
    });
}

function leadsLogin(form){
  var eIn = form.querySelector('[name=email]');
  var pIn = form.querySelector('[name=password]');
  var btn = form.querySelector('[data-leads-submit]');
  var err = form.querySelector('[data-leads-err]');
  var email = eIn ? String(eIn.value).trim() : '';
  var pwd = pIn ? String(pIn.value) : '';
  if(err) err.classList.remove('is-on');
  if(!email || !pwd){
    if(err){ err.textContent = T('请填写邮箱与密码。'); err.classList.add('is-on'); }
    return;
  }
  if(btn){ btn.disabled = true; btn.textContent = T('登录中…'); }
  sbSignIn(email, pwd).then(function(){
    leadsData = null; leadsErr = ''; leadsTried = false;
    render();

/* 删除一条线索：数据库侧的 delete 策略把关（仅允许名单内的账号可删）。
   用 return=representation 让服务器回传被删的行 —— 若删到 0 行（权限不足），
   回执是空数组，我们据此报错，不会出现「界面删了、库里还在」的假成功。 */
function leadsDelete(id){
  id = String(id == null ? '' : id);
  if(!id || leadsBusy) return;
  if(!window.confirm(T('确定删除这条线索吗？删除后不可恢复。'))) return;
  leadsBusy = true;
  var btn = document.querySelector('[data-lead-del="' + id + '"]');
  if(btn){ btn.disabled = true; }
  sbApi('/rest/v1/' + SUPABASE_CFG.table + '?id=eq.' + encodeURIComponent(id),
        { method: 'DELETE', prefer: 'return=representation' }, true)
    .then(function(r){
      if(r.status === 401 || r.status === 403){
        sbSaveSess(null);
        throw new Error(T('登录已失效，或该账号不在允许名单内。'));
      }
      if(!r.ok){ throw new Error(T('删除失败，请稍后重试。') + '（HTTP ' + r.status + '）'); }
      return r.json().catch(function(){ return null; });
    })
    .then(function(del){
      if(!del || !del.length){ throw new Error(T('删除未生效：该账号可能没有删除权限。')); }
      leadsData = (leadsData || []).filter(function(x){ return String(x.id) !== id; });
      leadsBusy = false;
      leadsPaint();
      toast(T('已删除。'));
    })
    .catch(function(err){
      leadsBusy = false;
      leadsPaint();
      toast((err && err.message) ? err.message : T('删除失败，请稍后重试。'));
    });
}

var LEAD_COLS = [
  ['created_at', '提交时间'], ['name', '姓名'], ['company', '公司'], ['email', '邮箱'],
  ['phone', '电话'], ['inquiry', '需求类型'], ['message', '需求说明'],
  ['page', '来源页面'], ['lang', '语言']
];
function leadTime(v){
  if(!v) return '';
  var d = new Date(v);
  if(isNaN(d.getTime())) return String(v);
  var p = function(n){ return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate())
       + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function leadsCSV(rows){
  var q = function(v){
    v = (v == null) ? '' : String(v);
    return '"' + v.replace(/\r?\n/g, ' ').replace(/"/g, '""') + '"';
  };
  var out = [LEAD_COLS.map(function(c){ return q(T(c[1])); }).join(',')];
  rows.forEach(function(r){
    out.push(LEAD_COLS.map(function(c){
      var v = r[c[0]];
      if(c[0] === 'created_at' && v){ v = leadTime(v); }
      return q(v);
    }).join(','));
  });
  return out.join('\r\n');
}
/* bom=true 时加 UTF-8 BOM，否则 Excel 打开中文会乱码 */
function downloadText(name, text, mime, bom){
  try {
    var blob = new Blob([(bom ? '\uFEFF' : '') + text], { type: mime + ';charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      if(a.parentNode) a.parentNode.removeChild(a);
      try { URL.revokeObjectURL(url); } catch(e){}
    }, 0);
  } catch(e){ toast(T('导出失败，请更换浏览器重试。')); }
}

function contactFallback(form){

  if(btn){ btn.disabled = false; btn.textContent = T('提交咨询'); }

  var ok = form.querySelector('[data-form-ok]');
  var body = form.querySelector('[data-form-body]');
  if(ok) ok.style.display = 'flex';
  if(body) body.style.display = 'none';

function contactSubmit(form){
  var hp = form.querySelector('[name=website]');
  var bc = form.querySelector('[name=botcheck]');
  if((hp && hp.value.trim() !== '') || (bc && bc.checked)){
    contactDone(form);   /* 蜜罐命中：静默丢弃，不给爬虫反馈 */
    return;
  }
  var d = contactData(form);
  var errBox = form.querySelector('[data-form-err]');
  if(errBox) errBox.classList.remove('is-on');

  var chans = [];
  if(sbReady()){ chans.push(sbInsertLead(d)); }            /* 主通道：写进自己的数据库 */
  if(FORM_CFG.sheetRelay){ chans.push(sendViaSheet(d)); }
  if(FORM_CFG.emailKey){ chans.push(sendViaEmail(d)); }
  if(FORM_CFG.wecomHook){ chans.push(sendViaWecom(d)); }
  if(!chans.length){ contactFallback(form); return; }      /* 未配置：不假装成功 */

  var btn = form.querySelector('button[type=submit]');
  if(btn){ btn.disabled = true; btn.textContent = T('提交中…'); }
  Promise.all(chans).then(function(rs){
    var ok = rs.some(function(x){ return x; });
    if(ok){ contactDone(form); }
    else { contactFallback(form); toast(T('提交失败，请稍后重试。')); }
  });
}

/* ---------- 筛选 ---------- */
function applyFilter(target, value){
  var all = document.querySelectorAll('[data-series-item],[data-cat-item],[data-type-item]');
  var shown = 0;
  all.forEach(function(el){
    if(!el.hasAttribute(target)) return;
    var v = el.getAttribute(target);
    var hit = (value === 'all' || v === value);
    el.style.display = hit ? '' : 'none';
    if(hit) shown++;
  });
  var counter = document.getElementById('countLabel');
  if(counter && target === 'data-series-item'){
    counter.textContent = (LANG === 'en')
      ? (shown + ' product' + (shown === 1 ? '' : 's'))
      : ('共 ' + shown + ' 款商品');
  }
}

  mergeNews();
  rebuildNewsRoutes();
  renderChrome();   /* 重建底部走查下拉，纳入新增的详情页 */
  render();
  adminClose();
}
function adminSubmit(form){
  function val(n){
    var el = form.querySelector('[name="' + n + '"]');
    return el ? String(el.value).trim() : '';
  }
  var paras = val('body').split(/\r?\n\s*\r?\n/)
    .map(function(s){ return s.replace(/\s+/g, ' ').trim(); })
    .filter(function(s){ return s.length; });
  var d = {
    title: val('title'),
    cat: val('cat') || 'company',
    date: val('date'),
    desc: val('desc'),
    body: paras,
    img: val('img'),
    read: val('read')
  };
  if(d.img && !/^(https?:|data:image\/|\.{0,2}\/?assets\/)/i.test(d.img)){
    d.img = 'assets/' + d.img.replace(/^\.?\//, '');
  }
  var id = (adminState && adminState.editId) || newNewsId();
  var obj = {
    id: id, custom: 1,
    cat: d.cat, catLabel: catLabelOf(d.cat),
    date: d.date, read: d.read || autoRead(d),
    title: d.title, desc: d.desc, body: d.body
  };
  if(d.img) obj.img = d.img;
  var hit = -1;
  for(var i = 0; i < CUSTOM_NEWS.length; i++){ if(CUSTOM_NEWS[i].id === id){ hit = i; } }
  if(hit >= 0) CUSTOM_NEWS[hit] = obj; else CUSTOM_NEWS.unshift(obj);
  var ok = saveCustomNews();
  if(!ok){
    CUSTOM_NEWS = CUSTOM_NEWS.filter(function(n){ return n.id !== id; });
    toast(T('浏览器存储空间不足，保存失败。'));
    return;
  }
  adminAfterSave();
  toast(T('已发布，可在新闻列表查看。'));
}
function adminDelete(id){
  if(!window.confirm(T('确定删除这条动态吗？删除后不可恢复。'))) return;
  CUSTOM_NEWS = CUSTOM_NEWS.filter(function(n){ return n.id !== id; });
  delete ASSETS['news/' + id];
  adminAfterSave();
  toast(T('已删除。'));
}
function adminRender(){   /* 切语言时同步弹窗文案（表单有未保存内容则不重绘） */
  var a = document.getElementById('adminModal');
  if(!a || !a.classList.contains('is-open')) return;
  if(adminState && adminState.step === 'form') return;
  adminShow(adminState ? adminState.step : 'pwd');
}

/* 本地图片 → 压到 1400px 宽 → data URL */
function readImageFile(file){
  if(!file) return;
  if(!/^image\//.test(file.type)){ toast(T('请选择图片文件。')); return; }
  var fr = new FileReader();
  fr.onerror = function(){ toast(T('图片读取失败。')); };
  fr.onload = function(){
    var im = new Image();
    im.onerror = function(){ toast(T('图片读取失败。')); };
    im.onload = function(){
      var MAX = 1400, w = im.naturalWidth, h = im.naturalHeight;
      if(w > MAX){ h = Math.round(h * MAX / w); w = MAX; }
      var cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(im, 0, 0, w, h);
      var url = '';
      try { url = cv.toDataURL('image/webp', 0.86); } catch(e){ url = ''; }
      if(url.indexOf('data:image/webp') !== 0){ url = cv.toDataURL('image/jpeg', 0.88); }
      var a = document.getElementById('adminModal');
      if(!a) return;
      var inp = a.querySelector('[name="img"]');
      if(inp) inp.value = url;
      var pv = document.getElementById('imgPrev');
      if(pv) pv.style.backgroundImage = 'url(' + url + ')';
      toast(T('图片已压缩并载入。'));
    };
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* ---------- 启动 ---------- */
renderChrome();

/* 语言切换 */
document.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('[data-lang]') : null;
  if(b) setLang(b.getAttribute('data-lang'));
});

window.addEventListener('hashchange', render);
render();
</script>
