name: Supabase keepalive

# Supabase 免费项目连续 7 天无数据库活动会被自动暂停。
# 这里每 2 天做一次只读查询制造活动；非 200 即失败 → GitHub 给你发邮件告警。
# 注意：GitHub 会停掉「60 天无提交」仓库的定时任务，每两个月来随便提交一次即可。

on:
  schedule:
    - cron: '17 3 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SB_URL: https://nkjiskcwqnqbyiwbkbln.supabase.co
          SB_KEY: sb_publishable_1RtjFlsp2k5XdYyUvANDBA_sOtyE9kQ
        run: |
          code=$(curl -sS -o /tmp/body -w '%{http_code}' \
            "$SB_URL/rest/v1/leads?select=id&limit=1" \
            -H "apikey: $SB_KEY" --max-time 30 || echo "000")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::保活失败（HTTP $code）—— Supabase 可能被暂停，去控制台 Resume 后重跑。"
            exit 1
          fi
